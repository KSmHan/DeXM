The fastest cash under your own control is inventory: $4.67M of excess at 72.4 days DIO against a ≤55 day target. $1.5–2.0M of that is realistically releasable inside 60 days.`,59),BZ(`m5`,`user`,`And the 96 negative-margin SKUs — do we exit them or reprice?`,64),BZ(`m6`,`assistant`,`Neither, wholesale. The 96 split into three groups, and the decision is different for each:
