body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}

button,.filebtn{font:500 14px var(--body);border-radius:4px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center}

.field{display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-width:0}

.summary{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}

.kpi{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}

tr.sub td{font-weight:600}
tr.key td{font-weight:600;background:var(--accent-soft)}

td.neg{color:var(--bad)}
td.below{background:var(--bad-soft)!important;color:var(--bad)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

   [45000,18.4,10.6,2.2,1.5,2.4],[38000,15.2,11.6,2.4,1.6,2.9],[8000,31.0,12.5,6.8,3.2,7.5],[6000,14.0,7.9,5.0,2.1,6.0],[1500,20.0,9.0,9.5,4.0,14.0],[20000,6.9,5.6,1.2,0.9,1.3]];
  m.skus=D.map((d,i)=>({name:names[i],vol:d[0],price:d[1],mat:d[2],lab:d[3],oth:d[4],bn:d[5]}));return m}

function compute(m){
  const t=(+m.settings.target||0)/100,n=x=>+x||0;
  const rows=m.skus.map((s,i)=>{const vol=n(s.vol),p=n(s.price),vc=n(s.mat)+n(s.lab)+n(s.oth),rev=vol*p,cmU=p-vc,cm=vol*cmU,cmp=rev?cm/rev*100:null,bn=n(s.bn);
    const cmh=bn>0?cmU/(bn/60):null;const pT=t<1&&vc>0?vc/(1-t):null;const repr=cm>=0&&cmp!=null&&cmp<t*100&&pT?Math.max(0,(pT-p)*vol):0;
    return{i,name:s.name||T.newSku,vol,p,vc,rev,cm,cmp,cmh,bn,bnHrs:bn*vol/60,repr,valid:vol>0&&p>0}});
  const v=rows.filter(r=>r.valid);const R=v.reduce((a,r)=>a+r.rev,0),CM=v.reduce((a,r)=>a+r.cm,0);
  const byRev=[...v].sort((a,b)=>b.rev-a.rev);let cum=0;byRev.forEach(r=>{const before=cum;cum+=r.rev;r.abc=R&&before/R<0.8?"A":R&&before/R<0.95?"B":"C"});
  const nA=byRev.filter(r=>r.abc==="A").length;
  v.forEach(r=>{const big=r.abc!=="C",ok=r.cmp!=null&&r.cmp>=t*100;r.act=r.cm<0?"loss":big?(ok?"core":"fix"):(ok?"niche":"tail")});
  const byCm=[...v].sort((a,b)=>b.cm-a.cm);let c2=0;const whale=byCm.map(r=>(c2+=r.cm,CM?c2/CM*100:0));
  const losers=v.filter(r=>r.cm<0),lossAmt=-losers.reduce((a,r)=>a+r.cm,0);
  const fixers=v.filter(r=>r.repr>0),reprAmt=fixers.reduce((a,r)=>a+r.repr,0);

  const avgCmh=bnH?withBn.reduce((a,r)=>a+r.cm,0)/bnH:null;const worstBn=[...withBn].sort((a,b)=>a.cmh-b.cmh)[0]||null;
  const fixed=n(m.settings.fixed);
  return{rows,valid:v,R,CM,cmp:R?CM/R*100:null,ebitda:CM-fixed,fixed,nA,n:v.length,byCm,whale,whalePeak:whale.length?Math.max(...whale):0,
    losers,lossAmt,fixers,reprAmt,pot:lossAmt+reprAmt,avgCmh,worstBn,t:t*100}
}

function parseNum(x){if(typeof x==="number")return isFinite(x)?x:null;if(x==null)return null;
  let s=String(x).trim().replace(/[\s $€£₽%]/g,"");if(!s||s==="-"||s==="—")return null;

  if(s.includes(",")&&s.includes("."))s=s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");
  else if(s.includes(","))s=/,\d{3}$/.test(s)&&!/,\d{3},?\d{1,2}$/.test(s)?s.replace(/,/g,""):s.replace(",",".");
  const v=parseFloat(s);return isFinite(v)?(neg?-v:v):null}
const HDR=[["name",/(^sku|артикул|наимен|product|item|description|позиция|номенклатур|изделие)/i],["vol",/(volume|qty|quantity|units|объ[её]м|кол-?во|количество|шт)/i],["price",/(price|цена)/i],
 ["rev",/(revenue|sales|выручк)/i],["mat",/(material|материал|сырь)/i],["lab",/(labou?r|труд|зарплат|работ)/i],["oth",/(other var|прочие перем|other|прочие|energy|энерг)/i],["bn",/(bottleneck|узк|min\/|мин\/|minutes|минут|cycle|цикл)/i]];
const TOTAL_RE=/(total|итого|всего|сумма|за год|per year|annual)/i;
function importAOA(rows){
  const txt=c=>c==null?"":String(c).trim();let hdr=-1,map={},totals={};
  for(let r=0;r<Math.min(rows.length,40);r++){const mm={},tt={};(rows[r]||[]).forEach((c,ci)=>{const t=txt(c);if(!t||typeof c==="number")return;
      for(const [k,re] of HDR)if(re.test(t)&&mm[k]==null){        // skip computed columns from our own export
        if(/(contribution|маржинальн|margin|маржа|доход на час|per bottleneck hour|abc|action|действие)/i.test(t))break;
        mm[k]=ci;tt[k]=TOTAL_RE.test(t)&&!/(на ед|per unit|\/ед|\/unit)/i.test(t);break}});
    if(mm.name!=null&&mm.vol!=null&&(mm.price!=null||mm.rev!=null)){hdr=r;map=mm;totals=tt;break}}
  if(hdr<0)return{error:"noHeader"};
  const m=blankModel();const found=[];
  const SET=[["company",/^(company|компания)$/i],["cur",/^(currency|валюта)$/i],["target",/(target contribution|целевая маржа)/i],["fixed",/(fixed costs|постоянные затраты)/i]];
  for(let r=0;r<hdr;r++){const row=rows[r]||[];row.forEach((c,ci)=>{const t=txt(c);for(const [k,re] of SET)if(re.test(t)&&!found.includes(k)){const v=row.slice(ci+1).find(x=>x!=null&&txt(x)!=="");if(v==null)continue;
        m.settings[k]=k==="company"||k==="cur"?txt(v):(parseNum(v)??0);if(k==="target"&&Math.abs(m.settings.target)<=1&&m.settings.target)m.settings.target*=100;found.push(k);break}})}
  for(let r=hdr+1;r<rows.length;r++){const row=rows[r]||[];const name=txt(row[map.name]);if(!name||TOTAL_RE.test(name)&&/^(total|итого)/i.test(name))continue;
    const g=k=>map[k]!=null?parseNum(row[map[k]]):null;const vol=g("vol");if(vol==null)continue;
    let price=g("price");if(price==null&&g("rev")!=null&&vol)price=g("rev")/vol;
    const per=k=>{const v=g(k);if(v==null)return 0;return totals[k]&&vol?v/vol:v};
    m.skus.push({name,vol,price:price||0,mat:per("mat"),lab:per("lab"),oth:per("oth"),bn:g("bn")||0})}
  if(!m.skus.length)return{error:"noHeader"};
  return{model:m,n:m.skus.length,settings:found}
}

function exportPlan(m,blank){

    [[7,"B{r}*C{r}","n"],[8,"B{r}*(C{r}-D{r}-E{r}-F{r})","n"],[9,"IF(H{r}=0,0,I{r}/H{r})","pct"],[10,'IF(G{r}=0,"",(C{r}-D{r}-E{r}-F{r})/(G{r}/60))',"n"]])});
  const last=rows.length;
  push([T.total],[[1,`SUM(B${first}:B${last})`,"n"],[7,`SUM(H${first}:H${last})`,"n"],[8,`SUM(I${first}:I${last})`,"n"],[9,`IF(H{r}=0,0,I{r}/H{r})`,"pct"]]);const rTot=rows.length;

function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(Math.max(r,1e-9))));const n=r/p;return(n<1.5?1:n<3?2:n<7?5:10)*p}
function drawChart(cv,c,pal,wpx,hpx,scale){

  cv.width=w*dpr;cv.height=hgt*dpr;const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,hgt);
  const B=c.byCm;if(!B.length)return;const padL=64,padR=46,padT=12,padB=c.n<=24?30:14;

  c.rows.forEach(r=>{const set=(id,txt,neg)=>{const el=$(id);if(!el)return;el.textContent=txt;el.classList.toggle("neg",!!neg)};
    if(!r.valid){["rev","cm","cmp","cmh"].forEach(k=>set(`o-${k}-${r.i}`,"—"));set(`o-abc-${r.i}`,"");const a=$(`o-act-${r.i}`);if(a)a.innerHTML="";return}
    set(`o-rev-${r.i}`,fmt(r.rev));set(`o-cm-${r.i}`,fmt(r.cm),r.cm<0);set(`o-cmp-${r.i}`,pct(r.cmp),r.cmp<c.t);set(`o-cmh-${r.i}`,r.cmh==null?"—":fmt(r.cmh),r.cmh<0);
    set(`o-abc-${r.i}`,r.abc);const a=$(`o-act-${r.i}`);if(a)a.innerHTML=`<span class="tag" style="--tc:${ACT_COL[r.act]}">${T.act[r.act]}</span>`});
  const tv=c.valid.reduce((a,r)=>a+r.vol,0);$("t-vol").textContent=fmt(tv);$("t-rev").textContent=fmt(c.R);$("t-cm").textContent=fmt(c.CM);$("t-cmp").textContent=pct(c.cmp);$("t-cmh").textContent=c.avgCmh==null?"—":fmt(c.avgCmh);
  $("kpis").innerHTML=kpiData(c).map(([l,v,s,bad])=>`<div class="kpi${bad?" bad":""}"><span class="label">${l}</span><b>${v}</b><small>${esc(s||"")}</small></div>`).join("");
  drawChart($("chart"),c,pagePal());
  const v=verdictData(c),vd=$("verdict");
  vd.innerHTML=`<span class="label">${T.v.label}</span> ${v.sev>=0?`<span class="sev" style="background:${["var(--good)","var(--warn)","var(--bad)"][v.sev]}">${T.v.sev[v.sev]}</span>`:""}<h2>${esc(v.h)}</h2><ul>${v.notes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${v.levers.length?`<span class="label">${T.v.levers}</span><ul>${v.levers.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}<p class="cta">${T.v.cta}</p>`}
const redraw=()=>drawChart($("chart"),compute(model),pagePal());
window.addEventListener("resize",redraw);
const mq=window.matchMedia("(prefers-color-scheme: dark)");mq.addEventListener&&mq.addEventListener("change",redraw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

const LIBS={xlsx:"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",jspdf:"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"};
const loaded={};function lib(k){return loaded[k]||(loaded[k]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=LIBS[k];s.onload=res;s.onerror=()=>{loaded[k]=null;rej(new Error("load"))};document.head.appendChild(s)}))}
const browserDl={save:async({filename,data})=>{const url=URL.createObjectURL(new Blob([data]));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return{status:"saved"}}};
let dl=null;const dlReady=window.claude&&window.claude.use?window.claude.use("downloads").then(d=>{dl=d||browserDl}).catch(()=>{dl=browserDl}):(dl=browserDl,Promise.resolve());
function disableDl(){["btnTemplate","btnXlsx","btnPdf"].forEach(id=>{$(id).disabled=true;$(id).title=T.st.noDl})}
async function offer(filename,data,okMsg){await dlReady;if(!dl){status(T.st.noDl,"err");return}
  status(okMsg);try{await dl.save({filename,data});status(T.st.saved,"ok")}
  catch(e){const code=e&&e.code;status(code==="declined"?T.st.declined:code==="unavailable"||code==="not_granted"?T.st.noDl:T.st.fail,code==="declined"?"":"err")}}
const fname=ext=>`${(model.settings.company||"DeXM").replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"")||"DeXM"}-SKU-analysis.${ext}`;
async function buildXlsx(blank){status(T.st.loading);await lib("xlsx");
  const m=blank?blankModel():model;const {rows,f}=exportPlan(m,blank);
  const ws=XLSX.utils.aoa_to_sheet(rows);
  f.forEach(([r,list])=>list.forEach(([ci,fx,kind])=>{const addr=XLSX.utils.encode_cell({r:r-1,c:ci});ws[addr]={t:"n",f:fx.replace(/\{r\}/g,r),z:kind==="pct"?"0.0%":"#,##0;(#,##0)"}}));
  ws["!cols"]=[{wch:34},{wch:14},{wch:11},{wch:11},{wch:11},{wch:11},{wch:11},{wch:14},{wch:14},{wch:10},{wch:14},{wch:6},{wch:34}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"SKU");return XLSX.write(wb,{bookType:"xlsx",type:"array"})}
$("btnTemplate").onclick=async()=>{try{const b=await buildXlsx(true);await offer(LANG==="ru"?"DeXM-шаблон-SKU-анализ.xlsx":"DeXM-SKU-analysis-template.xlsx",new Uint8Array(b),T.st.tpl)}catch(e){console.error(e);status(T.st.fail,"err")}};
$("btnXlsx").onclick=async()=>{try{const b=await buildXlsx(false);await offer(fname("xlsx"),new Uint8Array(b),T.st.xlsx)}catch(e){console.error(e);status(T.st.fail,"err")}};
$("importFile").addEventListener("change",async e=>{const file=e.target.files[0];e.target.value="";if(!file)return;
  try{status(T.st.loading);await lib("xlsx");const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    let best=null;for(const name of wb.SheetNames){const r=importAOA(XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null}));if(!r.error){best=r;break}}
    if(!best){status(T.st.noHeader,"err");return}
    model=best.model;isSample=false;$("sample").hidden=true;save();renderSettings();renderGrid();
    status(T.st.imported(best.n,best.settings.map(k=>T.set[k]).join(", ")),"ok")}
  catch(err){console.error(err);status(T.st.readFail,"err")}});
$("btnReset").onclick=()=>{model=blankModel();isSample=false;$("sample").hidden=true;save();renderSettings();renderGrid();status(T.st.cleared,"ok")};

function reportPages(){
  const c=compute(model),s=model.settings,v=verdictData(c),PW=1500,PH=1060,SC=2,M=50,CW=PW-2*M;
  const F={sans:'"IBM Plex Sans","Segoe UI",Arial,sans-serif',mono:'"IBM Plex Mono",Menlo,monospace',disp:'"Archivo","Helvetica Neue",Arial,sans-serif'};
  const P={fg:"#1b2224",muted:"#5d686b",line:"#d6dbd9",band:"#eef1ef",acc:"#0e6b6b",accSoft:"#dcecea",bad:"#b4442d",good:"#2f7d4f",warn:"#b7791f"};
  const pages=[];
  const newPage=()=>{const cv=document.createElement("canvas");cv.width=PW*SC;cv.height=PH*SC;const g=cv.getContext("2d");g.scale(SC,SC);g.fillStyle="#fff";g.fillRect(0,0,PW,PH);pages.push(cv);return g};
  const foot=(g,n)=>{g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.textAlign="left";g.fillText("DeXM Management · info@dexm-m.com · +1 917 523 0461 · dexm-m.com",M,PH-28);g.textAlign="right";g.fillText(String(n),PW-M,PH-28);g.textAlign="left"};
  const wrap=(g,text,x,y,maxW,lh)=>{const words=String(text).replace(/<[^>]+>/g,"").split(" ");let line="";for(const w of words){const t=line?line+" "+w:w;if(g.measureText(t).width>maxW&&line){g.fillText(line,x,y);y+=lh;line=w}else line=t}if(line){g.fillText(line,x,y);y+=lh}return y};
  const clip=(g,text,maxW)=>{text=String(text);if(g.measureText(text).width<=maxW)return text;while(text.length>1&&g.measureText(text+"…").width>maxW)text=text.slice(0,-1);return text+"…"};
  let g=newPage(),y=M+24;
  g.fillStyle=P.fg;g.font=`800 30px ${F.disp}`;g.fillText(T.sheetTitle,M,y);y+=28;
  g.font=`14px ${F.sans}`;g.fillStyle=P.muted;g.fillText([s.company,`${T.set.cur}: ${C()}`,`${T.set.target}: ${pf.format(+s.target||0)}`,`${T.prepared}: ${new Date().toLocaleDateString(loc)}`].filter(Boolean).join("   ·   "),M,y);y+=14;
  g.fillStyle=P.fg;g.fillRect(M,y,CW,2);y+=22;
  const kw=(CW-5*12)/6;kpiData(c).forEach(([l,val,sub,bad],i)=>{const x=M+i*(kw+12);g.strokeStyle=P.line;g.lineWidth=1;g.strokeRect(x+.5,y+.5,kw,78);
    g.font=`500 11px ${F.mono}`;g.fillStyle=P.muted;g.fillText(clip(g,l.toUpperCase(),kw-20),x+10,y+20);
    g.font=`600 24px ${F.mono}`;g.fillStyle=bad?P.bad:P.fg;g.fillText(clip(g,val,kw-20),x+10,y+50);g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.fillText(clip(g,sub||"",kw-20),x+10,y+68)});
  y+=104;const vy=y;
  g.font=`700 19px ${F.disp}`;g.fillStyle=P.fg;y=wrap(g,v.h,M+18,y+18,CW-30,24);
  g.font=`13px ${F.sans}`;v.notes.forEach(t=>{y=wrap(g,"•  "+t,M+18,y+2,CW-40,19)});
  if(v.levers.length){g.font=`600 13px ${F.sans}`;g.fillText(T.v.levers,M+18,y+8);y+=28;g.font=`13px ${F.sans}`;v.levers.forEach(t=>{y=wrap(g,"•  "+t,M+18,y,CW-40,19)})}
  g.fillStyle=v.sev<0?P.muted:[P.good,P.warn,P.bad][v.sev];g.fillRect(M,vy,5,y-vy);y+=20;
  const ch=Math.max(220,PH-y-70),cc=document.createElement("canvas");
  drawChart(cc,c,{fg:P.fg,muted:P.muted,line:P.line,good:P.good,bad:P.bad,accent:P.acc,surface:"#fff",mono:F.mono},CW,ch,SC);
  g.drawImage(cc,M,y,CW,ch);foot(g,1);
  const cols=[[T.col.sku,280,"l"],[T.col.vol,110,"r"],[T.col.price,90,"r"],[LANG==="ru"?"Перем. затраты на ед.":"Variable cost per unit",140,"r"],[T.col.rev,120,"r"],[T.col.cm,130,"r"],[T.col.cmp,80,"r"],[LANG==="ru"?"Доход / час узк. места":"Per bottleneck hour",140,"r"],[T.col.abc,40,"l"],[T.col.act,240,"l"]];
  const sc=CW/cols.reduce((a,x)=>a+x[1],0);cols.forEach(x=>x[1]*=sc);
  const list=order(c).map(i=>c.rows[i]).filter(r=>r.valid);const RH=22,HH=40,top=M+40,per=Math.floor((PH-top-HH-70-RH)/RH);
  for(let st=0,pn=2;st<list.length||st===0;st+=per,pn++){
    g=newPage();g.fillStyle=P.fg;g.font=`700 18px ${F.disp}`;g.fillText(T.sheetTitle+(s.company?` · ${s.company}`:""),M,M+14);
    g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.fillText(`${T.set.cur}: ${C()}`,M,M+32);
    let ty=top;const row=(vals,kind,colors)=>{if(kind==="key"){g.fillStyle=P.accSoft;g.fillRect(M,ty,CW,RH)}
      let x=M;cols.forEach(([,w,al],i)=>{const t=vals[i]==null?"":String(vals[i]);g.font=`${kind==="key"||kind==="head"?"600 ":""}${i===0||i>=8?"12px "+F.sans:"11.5px "+F.mono}`;
        g.fillStyle=kind==="head"?P.muted:(colors&&colors[i])||P.fg;if(kind==="head"){g.font=`500 10.5px ${F.sans}`}
        if(al==="r"){g.textAlign="right";g.fillText(clip(g,t,w-10),x+w-5,ty+15)}else{g.textAlign="left";g.fillText(clip(g,t,w-10),x+5,ty+15)}x+=w});
      g.fillStyle=kind==="head"?P.fg:P.line;g.fillRect(M,ty+RH-1,CW,kind==="head"?1.5:1);ty+=RH};
    row(cols.map(x=>x[0]),"head");
    const AC={loss:P.bad,core:P.good,fix:P.warn,niche:P.acc,tail:P.warn};
    list.slice(st,st+per).forEach(r=>row([r.name,fmt(r.vol),fmt2(r.p),fmt2(r.vc),fmt(r.rev),fmt(r.cm),pct(r.cmp),r.cmh==null?"—":fmt(r.cmh),r.abc,T.act[r.act]],"",[null,null,null,null,null,r.cm<0?P.bad:null,r.cmp<c.t?P.bad:null,null,null,AC[r.act]]));
    if(st+per>=list.length)row([T.total,fmt(c.valid.reduce((a,r)=>a+r.vol,0)),"","",fmt(c.R),fmt(c.CM),pct(c.cmp),c.avgCmh==null?"—":fmt(c.avgCmh),"",""],"key");
    g.textAlign="left";foot(g,pn);if(!list.length)break}
  return pages}
$("btnPdf").onclick=async()=>{try{status(T.st.loading);await lib("jspdf");if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const pages=reportPages();const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
  const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
  pages.forEach((cv,i)=>{if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,pw,ph)});
  await offer(fname("pdf"),pdf.output("arraybuffer"),T.st.pdf)}catch(e){console.error(e);status(T.st.fail,"err")}};

texts();renderSettings();renderGrid();$("sample").hidden=!isSample;
})()}

</script>
