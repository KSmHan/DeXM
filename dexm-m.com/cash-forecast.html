:root{

  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131819; --surface:#1b2224; --fg:#e6ebea; --muted:#9aa6a8; --line:#2e3739;
  --accent:#4fb3ad; --accent-soft:#1f3534; --steel:#b9c5c7; --band:#20292b;
  --good:#5fbf86; --warn:#e0a84a; --bad:#e2765f; --bad-soft:#3a2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131819; --surface:#1b2224; --fg:#e6ebea; --muted:#9aa6a8; --line:#2e3739;
  --accent:#4fb3ad; --accent-soft:#1f3534; --steel:#b9c5c7; --band:#20292b;
  --good:#5fbf86; --warn:#e0a84a; --bad:#e2765f; --bad-soft:#3a2420; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
header{border-bottom:2px solid var(--fg);padding-bottom:14px}
.brand{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(26px,4vw,38px)/1.1 var(--display);margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
.lede{max-width:72ch;color:var(--muted);margin:8px 0 0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.filebtn{font:500 14px var(--body);border-radius:4px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center}
button.primary,.filebtn{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.filebtn:focus-within,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.status{font-size:13px;color:var(--muted);min-height:1.2em;flex-basis:100%}
.status.ok{color:var(--good)} .status.err{color:var(--bad)}
.notice{font-size:13px;background:var(--accent-soft);padding:10px 12px;border-radius:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.label{font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input{font:15px var(--body);padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
.field input.num{font-family:var(--mono);text-align:right}
.summary{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.summary{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font:600 20px/1.2 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)}
canvas{width:100%;height:240px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}
.verdict h2{font:700 21px/1.25 var(--display);margin:8px 0 6px;text-wrap:balance}
.verdict p{margin:0 0 8px;font-size:14px;color:var(--muted)}
.verdict ul{margin:4px 0 10px;padding-left:18px;font-size:14px;display:grid;gap:3px}
.sev{display:inline-block;font:500 12px var(--mono);padding:2px 8px;border-radius:3px;color:var(--surface)}
.cta{border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
th,td{padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{font:500 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 6px;text-align:right;background:var(--surface);position:sticky;top:0}
thead th small{display:block;font-size:11px;letter-spacing:0;text-transform:none}
th.lab,td.lab{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:6px 10px;min-width:230px;max-width:280px;border-right:1px solid var(--line)}
thead th.lab{z-index:2}
td.lab{white-space:normal}
td.lab input{font:13px var(--body);border:1px dashed var(--line);border-radius:3px;padding:3px 6px;background:var(--bg);color:var(--fg);width:calc(100% - 30px)}
td.lab .del{padding:0 6px;margin-left:4px;font-size:15px;line-height:1.4;border:0;background:none;color:var(--muted)}
td.v{text-align:right;padding:0 2px}
td.v input{width:84px;font:13px var(--mono);text-align:right;border:1px solid transparent;border-radius:3px;padding:5px 6px;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums}
td.v input:hover{border-color:var(--line)}
td.c{text-align:right;padding:6px 8px;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.tot{font-weight:600;background:var(--band)}
tr.sec td{background:var(--band);font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:8px 10px}
tr.sec td.lab{background:var(--band)}
tr.sub td{font-weight:600}
tr.key td{font-weight:600;background:var(--accent-soft)}
tr.key td.lab{background:var(--accent-soft)}
td.neg{color:var(--bad)}
td.below{background:var(--bad-soft)!important;color:var(--bad)}
tr.add td{padding:4px 10px;border-bottom:1px solid var(--line)}
tr.add button{font-size:12px;padding:3px 8px;border-style:dashed;background:none;color:var(--accent)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
footer{padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
footer span{user-select:all}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function nextMonday(){const d=new Date();const day=d.getDay();const add=((8-day)%7)||7;d.setDate(d.getDate()+add);return iso(d)}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function weekDate(start,w){const d=new Date(start+"T00:00:00");if(isNaN(d))return "";d.setDate(d.getDate()+7*w);
  return LANG==="ru"?`${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}`:d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}

   oops:[20,18,22,20,19,21,20,20,22,20,19,21,22],capex:[0,0,0,0,0,300,0,0,0,0,0,0,0],debt:[0,0,0,48,0,0,0,48,0,0,0,48,0],

function compute(m){
  const sum=sec=>{const a=zeros();m.lines.filter(l=>l.sec===sec).forEach(l=>l.vals.forEach((v,i)=>a[i]+=+v||0));return a};
  const tr=sum("rec"),tod=sum("ops"),tno=sum("non"),tfin=sum("fin");
  const ocf=tr.map((v,i)=>v-tod[i]),ncf=ocf.map((v,i)=>v-tno[i]+tfin[i]);
  const open=[],end=[],avail=[],liq=[],min=zeros().map(()=>+m.settings.min||0),head=[];
  let cash=+m.settings.opening||0,cum=0;
  for(let i=0;i<W;i++){open[i]=cash;cash+=ncf[i];end[i]=cash;cum+=tfin[i];
    avail[i]=Math.max(0,(+m.settings.limit||0)-Math.max(0,m.lines.filter(l=>l.id==="rev").reduce((s,l)=>s+l.vals.slice(0,i+1).reduce((a,b)=>a+(+b||0),0),0)));
    head[i]=end[i]-min[i];liq[i]=end[i]+avail[i]}
  const revCum=[];let rc=0;const rev=m.lines.find(l=>l.id==="rev");for(let i=0;i<W;i++){rc+=rev?(+rev.vals[i]||0):0;revCum[i]=rc}
  let lowI=0;end.forEach((v,i)=>{if(v<end[lowI])lowI=i});
  let tightI=0;head.forEach((v,i)=>{if(v<head[tightI])tightI=i});
  const below=end.map((v,i)=>v<min[i]);

    nBelow:below.filter(Boolean).length,maxGap:Math.max(0,...head.map(v=>-v)),liqGap:Math.max(0,...liq.map(v=>-v)),
    ocf13:ocf.reduce((a,b)=>a+b,0),peakRev:Math.max(0,...revCum)};
}
const sum13=a=>a.reduce((x,y)=>x+(+y||0),0);

function parseNum(x){if(typeof x==="number")return isFinite(x)?x:null;if(x==null)return null;
  let s=String(x).trim().replace(/[\s $€£₽]/g,"");if(!s||s==="-"||s==="—")return null;
  let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(s.includes(",")&&s.includes("."))s=s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");
  else if(s.includes(","))s=/,\d{3}$/.test(s)&&!/,\d{3},?\d{1,2}$/.test(s)?s.replace(/,/g,""):s.replace(",",".");
  const n=parseFloat(s);return isFinite(n)?(neg?-n:n):null}
const WEEK_RE=/^(week|wk|w|неделя|нед)\.?\s*(\d{1,2})\b/i;

function importAOA(rows){
  // find header row with week columns
  let hdr=-1,map={};
  for(let r=0;r<Math.min(rows.length,60);r++){const m={};(rows[r]||[]).forEach((c,ci)=>{const t=String(c==null?"":c).trim();const mm=t.match(WEEK_RE);
      const n=mm?+mm[2]:(/^\d{1,2}$/.test(t)?+t:null);if(n>=1&&n<=W&&m[n]==null)m[n]=ci});
    if(Object.keys(m).length>=6){hdr=r;map=m;break}}
  if(hdr<0)return{error:"noHeader"};
  const first=Math.min(...Object.values(map));
  const model=blankModel();model.settings.units="";const found=[];
  const txt=c=>c==null?"":String(c).trim();
  // settings above header
  const SET=[["opening",/(opening|beginning cash|начальн|остаток (денег )?на начало|входящ)/i],["min",/(minimum|min\.? cash|минимальн|неснижаем)/i],["limit",/(credit line|revolver|line of credit|limit|кредитн.*лини|лимит)/i],["start",/(start|начало недели|дата начала)/i],["company",/(company|компания)/i],["units",/(units|единиц)/i]];
  for(let r=0;r<hdr;r++){const row=rows[r]||[];row.forEach((c,ci)=>{const t=txt(c);if(!t||typeof c==="number")return;
      for(const [k,re] of SET){if(re.test(t)&&!found.includes(k)){const rest=row.slice(ci+1).filter(x=>x!=null&&txt(x)!=="");if(!rest.length)continue;let v=rest[0];
          if(k==="start"){if(v instanceof Date)v=iso(v);else if(typeof v==="number")v=iso(new Date(Math.round((v-25569)*864e5)+new Date().getTimezoneOffset()*6e4));else if(/^\d{4}-\d{2}-\d{2}$/.test(txt(v)))v=txt(v);else{const d=new Date(txt(v));if(isNaN(d))continue;v=iso(d)}}
          else if(k==="company"||k==="units")v=txt(v);else{v=parseNum(v);if(v==null)continue}
          model.settings[k]=v;found.push(k);break}}})}
  if(!model.settings.units)model.settings.units=T.unitsDef;
  let curSec=null,n=0,added=0;const unrec=[],hit=new Set();
  for(let r=hdr+1;r<rows.length;r++){const row=rows[r]||[];
    const left=row.slice(0,first).map(txt);const nonEmpty=left.filter(Boolean);if(!nonEmpty.length)continue;
    const label=left[first-1]||nonEmpty[nonEmpty.length-1];const secText=nonEmpty.length>1?nonEmpty[0]:"";
    if(left.some(t=>/^(расч|calc)/i.test(t)))continue;
    const vals=[];let has=false;for(let w=1;w<=W;w++){const v=map[w]!=null?parseNum(row[map[w]]):null;vals.push(v==null?0:v);if(v!=null&&v!==0)has=true}
    const secOf=t=>{for(const [k,re] of SEC_RE)if(re.test(t))return k;return null};
    if(!vals.some((v,i)=>map[i+1]!=null&&row[map[i+1]]!=null&&txt(row[map[i+1]])!=="")){const s=secOf(label);if(s)curSec=s;continue}
    if(CALC_RE.test(label)&&!ALL_LABELS[label.toLowerCase()])continue;
    const sec=(secText&&secOf(secText))||curSec;
    let id=ALL_LABELS[label.toLowerCase()];if(!id)for(const [k,re] of ALIAS)if(re.test(label)){id=k;break}
    if(id){const line=model.lines.find(l=>l.id===id);
      line.vals=line.vals.map((v,i)=>v+(id==="rev"?vals[i]:Math.abs(vals[i])));if(!hit.has(id)){hit.add(id);n++}}
    else if(sec){model.lines.push({id:null,sec,label,vals:sec==="fin"?vals:vals.map(Math.abs)});added++}
    else if(has)unrec.push(label)}
  // keep custom lines grouped by section order
  model.lines.sort((a,b)=>SECS.indexOf(a.sec)-SECS.indexOf(b.sec));
  return{model,n,added,unrec,settings:found}
}

// Build worksheet rows + formula plan for Excel export
function exportPlan(m,blank){
  const c=compute(m);const col=i=>String.fromCharCode(67+i); // C..O
  const rows=[],f=[];const push=(r,formulas)=>{rows.push(r);if(formulas)f.push([rows.length,formulas])};
  const wk=[...Array(W)].map((_,i)=>`${T.week} ${i+1} · ${weekDate(m.settings.start,i)}`);
  push([T.sheetTitle]);push([T.company,"",blank?"":m.settings.company]);push([T.units,"",m.settings.units]);push([]);
  push([T.opening,"",blank?0:+m.settings.opening]);const rOpen=rows.length;
  push([T.min,"",blank?0:+m.settings.min]);const rMin=rows.length;
  push([T.limit,"",blank?0:+m.settings.limit]);const rLim=rows.length;
  push([T.start,"",m.settings.start]);push([]);
  push([T.section,T.line,...wk,T.total]);
  const subRow={};let revRow=null;
  SECS.forEach(s=>{push([T.sec[s]]);const startR=rows.length+1;
    const ls=m.lines.filter(l=>l.sec===s);
    ls.forEach(l=>{push([T.sec[s],labelOf(l),...(blank?zeros():l.vals.map(v=>+v||0)),null],[[W,`SUM(C{r}:O{r})`]]);if(l.id==="rev")revRow=rows.length});
    const endR=rows.length;const key={rec:"tr",ops:"tod",non:"tno",fin:"tfin"}[s];
    push([T.calc,T.r[key],...zeros(),null],[...[...Array(W)].map((_,i)=>[i,endR>=startR?`SUM(${col(i)}${startR}:${col(i)}${endR})`:"0"]),[W,`SUM(C{r}:O{r})`]]);subRow[s]=rows.length});
  const F=(fn,tot)=>[...[...Array(W)].map((_,i)=>[i,fn(col(i),i)]),...(tot?[[W,`SUM(C{r}:O{r})`]]:[])];
  push([]);
  push([T.calc,T.r.ocf,...zeros(),null],F(x=>`${x}${subRow.rec}-${x}${subRow.ops}`,1));const rOcf=rows.length;
  push([T.calc,T.r.ncf,...zeros(),null],F(x=>`${x}${rOcf}-${x}${subRow.non}+${x}${subRow.fin}`,1));const rNcf=rows.length;
  const rO=rows.length+1,rE=rows.length+2;
  push([T.calc,T.r.open,...zeros()],F((x,i)=>i===0?`$C$${rOpen}`:`${col(i-1)}${rE}`));
  push([T.calc,T.r.end,...zeros()],F(x=>`${x}${rO}+${x}${rNcf}`));
  push([T.calc,T.r.min,...zeros()],F(()=>`$C$${rMin}`));const rM=rows.length;
  push([T.calc,T.r.head,...zeros()],F(x=>`${x}${rE}-${x}${rM}`));
  push([T.calc,T.r.avail,...zeros()],F(x=>revRow?`MAX(0,$C$${rLim}-MAX(0,SUM($C${revRow}:${x}${revRow})))`:`$C$${rLim}`));const rA=rows.length;
  push([T.calc,T.r.liq,...zeros()],F(x=>`${x}${rE}+${x}${rA}`));
  return{rows,f,c};
}

function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function drawChart(cv,c,pal,wpx,hpx,scale){
  const dpr=scale||window.devicePixelRatio||1;const w=wpx||cv.clientWidth||600,hgt=hpx||cv.clientHeight||240;
  cv.width=w*dpr;cv.height=hgt*dpr;const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,hgt);
  const padL=58,padR=10,padT=12,padB=26;const vals=[...c.ncf,...c.end,c.min[0],0];
  let lo=Math.min(...vals),hi=Math.max(...vals);if(hi===lo)hi=lo+1;const span=hi-lo;lo-=span*.08;hi+=span*.08;
  const y=v=>padT+(hi-v)/(hi-lo)*(hgt-padT-padB);const bw=(w-padL-padR)/W;const x=i=>padL+bw*i+bw/2;
  g.font=`11px ${pal.mono}`;g.fillStyle=pal.muted;g.strokeStyle=pal.line;g.lineWidth=1;g.textAlign="right";g.textBaseline="middle";
  const step=niceStep((hi-lo)/4);for(let t=Math.ceil(lo/step)*step;t<=hi;t+=step){g.beginPath();g.moveTo(padL,y(t)+.5);g.lineTo(w-padR,y(t)+.5);g.stroke();g.fillText(fmt(t),padL-6,y(t))}
  g.strokeStyle=pal.fg;g.globalAlpha=.4;g.beginPath();g.moveTo(padL,y(0)+.5);g.lineTo(w-padR,y(0)+.5);g.stroke();g.globalAlpha=1;
  c.ncf.forEach((v,i)=>{g.fillStyle=v>=0?pal.good:pal.bad;g.globalAlpha=.55;const y0=y(0),y1=y(v);g.fillRect(x(i)-bw*.3,Math.min(y0,y1),bw*.6,Math.max(1,Math.abs(y1-y0)))});g.globalAlpha=1;
  g.strokeStyle=pal.bad;g.setLineDash([5,4]);g.lineWidth=1.5;g.beginPath();g.moveTo(padL,y(c.min[0]));g.lineTo(w-padR,y(c.min[0]));g.stroke();g.setLineDash([]);
  g.strokeStyle=pal.accent;g.lineWidth=2.5;g.beginPath();c.end.forEach((v,i)=>i?g.lineTo(x(i),y(v)):g.moveTo(x(i),y(v)));g.stroke();
  c.end.forEach((v,i)=>{g.beginPath();g.arc(x(i),y(v),i===c.lowI||i===W-1?4.5:3,0,7);g.fillStyle=c.below[i]?pal.bad:pal.accent;g.fill();g.strokeStyle=pal.surface;g.lineWidth=1.5;g.stroke()});
  g.fillStyle=pal.muted;g.textAlign="center";g.textBaseline="top";for(let i=0;i<W;i++)g.fillText(String(i+1),x(i),hgt-padB+8)}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(Math.max(r,1e-9))));const n=r/p;return(n<1.5?1:n<3?2:n<7?5:10)*p}

function reportPages(){
  const c=compute(model),s=model.settings,v=verdictData(c),PW=1500,PH=1060,SC=2,M=50,CW=PW-2*M;
  const F={sans:'"IBM Plex Sans","Segoe UI",Arial,sans-serif',mono:'"IBM Plex Mono",Menlo,monospace',disp:'"Archivo","Helvetica Neue",Arial,sans-serif'};
  const P={fg:"#1b2224",muted:"#5d686b",line:"#d6dbd9",band:"#eef1ef",acc:"#0e6b6b",accSoft:"#dcecea",bad:"#b4442d",good:"#2f7d4f",warn:"#b7791f"};
  const pages=[];
  const newPage=()=>{const cv=document.createElement("canvas");cv.width=PW*SC;cv.height=PH*SC;const g=cv.getContext("2d");g.scale(SC,SC);g.fillStyle="#fff";g.fillRect(0,0,PW,PH);g.textBaseline="alphabetic";pages.push(cv);return g};
  const foot=(g,n)=>{g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.textAlign="left";g.fillText("DeXM Management · info@dexm-m.com · +1 917 523 0461 · dexm-m.com",M,PH-28);g.textAlign="right";g.fillText(String(n),PW-M,PH-28);g.textAlign="left"};
  const wrap=(g,text,x,y,maxW,lh)=>{const words=String(text).split(" ");let line="";for(const w of words){const t=line?line+" "+w:w;if(g.measureText(t).width>maxW&&line){g.fillText(line,x,y);y+=lh;line=w}else line=t}if(line){g.fillText(line,x,y);y+=lh}return y};
  const clip=(g,text,maxW)=>{text=String(text);if(g.measureText(text).width<=maxW)return text;while(text.length>1&&g.measureText(text+"…").width>maxW)text=text.slice(0,-1);return text+"…"};
  // page 1: summary
  let g=newPage(),y=M+24;
  g.fillStyle=P.fg;g.font=`800 30px ${F.disp}`;g.fillText(T.sheetTitle,M,y);y+=28;
  g.font=`14px ${F.sans}`;g.fillStyle=P.muted;g.fillText([s.company,`${T.units}: ${s.units||""}`,`${T.start}: ${weekDate(s.start,0)}`,`${T.prepared}: ${new Date().toLocaleDateString(LANG==="ru"?"ru-RU":"en-US")}`].filter(Boolean).join("   ·   "),M,y);y+=14;
  g.fillStyle=P.fg;g.fillRect(M,y,CW,2);y+=22;
  const ks=kpiData(c),kw=(CW-5*12)/6;
  ks.forEach(([l,val,sub,bad],i)=>{const x=M+i*(kw+12);g.strokeStyle=P.line;g.lineWidth=1;g.strokeRect(x+.5,y+.5,kw,78);
    g.font=`500 11px ${F.mono}`;g.fillStyle=P.muted;g.fillText(clip(g,l.toUpperCase(),kw-20),x+10,y+20);
    g.font=`600 24px ${F.mono}`;g.fillStyle=bad?P.bad:P.fg;g.fillText(val,x+10,y+50);g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.fillText(sub||"",x+10,y+68)});
  y+=104;
  const sevC=[P.good,P.warn,P.bad][v.sev];const vy=y;g.fillStyle=sevC;
  g.font=`700 19px ${F.disp}`;g.fillStyle=P.fg;y=wrap(g,v.h,M+18,y+18,CW-30,24);g.font=`14px ${F.sans}`;g.fillStyle=P.muted;y=wrap(g,v.p,M+18,y+2,CW-30,20);
  if(v.sev){g.fillStyle=P.fg;g.font=`600 13px ${F.sans}`;g.fillText(T.v.levers,M+18,y+6);y+=26;g.font=`13px ${F.sans}`;g.fillStyle=P.fg;T.v.L.forEach(t=>{y=wrap(g,"•  "+t,M+18,y,CW-40,19)})}
  g.fillStyle=sevC;g.fillRect(M,vy,5,y-vy);y+=20;
  const ch=Math.max(220,PH-y-70),cc=document.createElement("canvas");
  drawChart(cc,c,{fg:P.fg,muted:P.muted,line:P.line,good:P.good,bad:P.bad,accent:P.acc,surface:"#fff",mono:F.mono},CW,ch,SC);
  g.drawImage(cc,M,y,CW,ch);y+=ch+8;
  g.font=`12px ${F.sans}`;let lx=M;[[P.good,T.lg.net,10],[P.acc,T.lg.end,3],[P.bad,T.lg.min,2]].forEach(([col,txt,h])=>{g.fillStyle=col;g.fillRect(lx,y+4-h/2,14,h);g.fillStyle=P.muted;g.fillText(txt,lx+20,y+8);lx+=g.measureText(txt).width+48});
  foot(g,1);
  // table pages
  const rows=[];const r=(lab,arr,kind,tot,red)=>rows.push({lab,arr,kind,tot,red});
  SECS.forEach(sec=>{rows.push({lab:T.sec[sec],kind:"sec"});model.lines.filter(l=>l.sec===sec).forEach(l=>r(labelOf(l),l.vals.map(x=>+x||0),"",sum13(l.vals)));
    const k={rec:"tr",ops:"tod",non:"tno",fin:"tfin"}[sec];r(T.r[k],c[k],"sub",sum13(c[k]))});
  rows.push({lab:LANG==="ru"?"Итоги":"Summary",kind:"sec"});
  r(T.r.ocf,c.ocf,"sub",c.ocf13);r(T.r.ncf,c.ncf,"sub",sum13(c.ncf));r(T.r.open,c.open,"");r(T.r.end,c.end,"key",null,i=>c.below[i]);r(T.r.min,c.min,"");r(T.r.head,c.head,"");r(T.r.avail,c.avail,"");r(T.r.liq,c.liq,"sub");
  const LW=330,VW=(CW-LW)/(W+1),RH=22,HH=44,top=M+40,per=Math.floor((PH-top-HH-70)/RH);
  for(let start=0,pn=2;start<rows.length;start+=per,pn++){
    g=newPage();g.fillStyle=P.fg;g.font=`700 18px ${F.disp}`;g.fillText(T.sheetTitle+(s.company?` · ${s.company}`:""),M,M+14);
    g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.fillText(`${T.units}: ${s.units||""}`,M,M+32);
    let ty=top;g.font=`500 11px ${F.mono}`;g.fillStyle=P.muted;g.textAlign="left";g.fillText(T.line.toUpperCase(),M+6,ty+26);g.textAlign="right";
    for(let i=0;i<=W;i++){const x=M+LW+VW*(i+1)-6;if(i<W){g.fillText(`${T.wk} ${i+1}`,x,ty+18);g.fillText(weekDate(s.start,i),x,ty+34)}else{const sp=T.total.indexOf(" ");g.fillText(T.total.slice(0,sp),x,ty+18);g.fillText(T.total.slice(sp+1),x,ty+34)}}
    g.fillStyle=P.fg;g.fillRect(M,ty+HH-1,CW,1.5);ty+=HH;
    rows.slice(start,start+per).forEach(row=>{
      if(row.kind==="sec"){g.fillStyle=P.band;g.fillRect(M,ty,CW,RH);g.fillStyle=P.fg;g.font=`600 12px ${F.sans}`;g.textAlign="left";g.fillText(row.lab.toUpperCase(),M+6,ty+15);ty+=RH;return}
      if(row.kind==="key"){g.fillStyle=P.accSoft;g.fillRect(M,ty,CW,RH)}
      const bold=row.kind==="sub"||row.kind==="key";g.fillStyle=P.fg;g.textAlign="left";g.font=`${bold?"600 ":""}12.5px ${F.sans}`;g.fillText(clip(g,row.lab,LW-12),M+6,ty+15);
      g.textAlign="right";g.font=`${bold?"600 ":""}12px ${F.mono}`;
      row.arr.forEach((x,i)=>{const red=row.red?row.red(i):x<0;g.fillStyle=red?P.bad:P.fg;g.fillText(fmt(x),M+LW+VW*(i+1)-6,ty+15)});
      if(row.tot!=null){g.fillStyle=row.tot<0?P.bad:P.fg;g.fillText(fmt(row.tot),M+LW+VW*(W+1)-6,ty+15)}
      g.fillStyle=P.line;g.fillRect(M,ty+RH-1,CW,1);ty+=RH});
    g.textAlign="left";foot(g,pn)}
  return pages}
$("btnPdf").onclick=async()=>{try{status(T.st.loading);await lib("jspdf");if(document.fonts&&document.fonts.ready)await document.fonts.ready;
