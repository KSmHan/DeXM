  const b=m.base,n=x=>+x||0,R=n(b.rev),M=n(b.mat),DL=n(b.dl),OC=n(b.oc),S=n(b.sga),s=m.settings;
  const E0=R-M-DL-OC-S;const contrib=R-M-DL*n(s.varL)/100-OC*n(s.varO)/100;
  const f={price:R,vol:contrib,mix:R,mat:M,scrap:M,lab:DL,oh:OC,sga:S,infl:-(M+DL+OC+S)};
  const items=[];
  m.lv.forEach(l=>{const imp=f[l.id]*n(l.v)/100;const w=l.id==="infl"?1:CONF_W[l.c];items.push({key:l.id,g:l.g,name:T.short[l.id],full:T.lv[l.id],imp,w,c:l.c,val:n(l.v),isInfl:l.id==="infl"})});
  m.custom.forEach(cu=>{const imp=n(cu.v);items.push({key:"c",g:cu.g,name:cu.label||T.newLine,full:cu.label||T.newLine,imp,w:CONF_W[cu.c],c:cu.c,val:n(cu.v),custom:true})});
  const up=items.reduce((a,x)=>a+x.imp,0),upR=items.reduce((a,x)=>a+x.imp*x.w,0);
  const lp=id=>n(m.lv.find(l=>l.id===id).v)/100;
  const R1=R*(1+lp("price")+lp("vol"));
  const pos=items.filter(x=>x.imp>0).sort((a,b)=>b.imp-a.imp),gross=pos.reduce((a,x)=>a+x.imp,0);
  const infl=items.filter(x=>x.isInfl).reduce((a,x)=>a+x.imp,0);
  const mult=n(s.mult),bench=n(s.bench);
  const E1=E0+up,Er=E0+upR;
  return{R,E0,m0:R?E0/R*100:null,items,up,upR,E1,Er,R1,m1:R1?E1/R1*100:null,mr:R1?Er/R1*100:null,bench,mult,val:up*mult,valR:upR*mult,
    pos,gross,lowShare:gross?pos.filter(x=>x.c===2&&!x.isInfl).reduce((a,x)=>a+x.imp,0)/gross:0,inflShare:gross?-infl/gross:0,conc:gross?pos[0].imp/gross:0}
}

function parseNum(x){if(typeof x==="number")return isFinite(x)?x:null;if(x==null)return null;
  let s=String(x).trim().replace(/[\s $€£₽%x×]/gi,"");if(!s||s==="-"||s==="—")return null;
  let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(s.includes(",")&&s.includes("."))s=s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");
  else if(s.includes(","))s=/,\d{3}$/.test(s)&&!/,\d{3},?\d{1,2}$/.test(s)?s.replace(/,/g,""):s.replace(",",".");
  const v=parseFloat(s);return isFinite(v)?(neg?-v:v):null}
const ALL={};["ru","en"].forEach(l=>{Object.entries(L[l].base).forEach(([k,v])=>ALL[v.toLowerCase()]=["base",k]);Object.entries(L[l].lv).forEach(([k,v])=>ALL[v.toLowerCase()]=["lv",k])});
const ALIAS=[["lv","infl",/(inflation|инфляц)/i],["lv","price",/(^price|pricing|цен)/i],["lv","vol",/(volume|объ[её]м)/i],["lv","mix",/(\bmix\b|ассортимент|микс)/i],["lv","scrap",/(scrap|yield|брак|выход годн)/i],
 ["lv","lab",/(productivity|производительн)/i],["lv","oh",/(overhead lever|overhead:|накладные:|сокращение накладн)/i],["lv","mat",/(purchasing|procurement|закупк)/i],["lv","sga",/(sg&a:|sg&a reduction|сокращение sg)/i],
 ["base","rev",/^(revenue|net revenue|sales|выручка|чистая выручка)$/i],["base","mat",/^(raw materials|materials|сырь|материал)/i],["base","dl",/^(direct labor|labor|прямой труд|труд)/i],["base","oc",/^(other cogs|other cost|overhead|прочая себестоим|накладн)/i],["base","sga",/^(sg&a|коммерческие и администр|sga)/i]];
const SEC_RE=[["rev",/(revenue lever|рычаги выручки)/i],["cost",/(cost lever|рычаги затрат)/i],["head",/(headwind|встречн)/i],["base",/(baseline|базовый)/i],["sum",/(summary|итоги)/i]];
const CONF_RE=[[0,/^(high|высок)/i],[1,/^(medium|med|средн)/i],[2,/^(low|низк)/i]];
const SET_RE=[["varL",/(variable share of labor|переменная доля труда)/i],["varO",/(variable share of other|переменная доля прочей)/i],["bench",/(benchmark|бенчмарк)/i],["mult",/(multiple|мультипликатор)/i]];

function importAOA(rows){
  const m=blankModel();const txt=c=>c==null?"":String(c).trim();const found=[];let n=0,added=0,cur=null;const unrec=[],seen=new Set();
  for(const row of rows){if(!row)continue;const cells=row.map(txt);
    const ci0=cells.findIndex(t=>/^(company|компания|units|единицы)$/i.test(t));
    if(ci0>=0){const k=/compan|компан/i.test(cells[ci0])?"company":"units";const v=cells.slice(ci0+1).find(Boolean);if(v&&!found.includes(k)){m.settings[k]=v;found.push(k)}continue}const ti=cells.findIndex(t=>t&&parseNum(t)==null&&!CONF_RE.some(([,re])=>re.test(t)));if(ti<0)continue;
    // label = last text cell before the first number (skips a leading section column)
    const numIdx=row.findIndex((c,i)=>i>ti&&c!=null&&txt(c)!==""&&parseNum(c)!=null);
    const texts=cells.slice(0,numIdx<0?cells.length:numIdx).filter(t=>t&&parseNum(t)==null&&!CONF_RE.some(([,re])=>re.test(t)));
    const label=texts[texts.length-1]||cells[ti];const lower=label.toLowerCase();
    if(texts.some(t=>/^(расч|calc)/i.test(t)))continue;
    for(const [k,re] of SEC_RE)if(texts.some(t=>re.test(t))){cur=k;break}
    if(numIdx<0){continue}
    const val=parseNum(row[numIdx]);let conf=null;cells.slice(numIdx+1).forEach(t=>{if(conf==null)for(const [ci,re] of CONF_RE)if(re.test(t)){conf=ci;break}});
    let hit=null;
    const set=SET_RE.find(([,re])=>re.test(label));
    if(set&&!found.includes(set[0])){m.settings[set[0]]=val;found.push(set[0]);continue}
    hit=ALL[lower];
    if(!hit)for(const [kind,k,re] of ALIAS)if(re.test(label)&&(kind==="lv"?cur!=="base":cur==null||cur==="base")){hit=[kind,k];break}
    if(hit&&seen.has(hit.join(":")))hit=hit[0]==="lv"&&cur&&GROUPS.includes(cur)?null:"dup";
    if(hit==="dup")continue;
    if(hit){seen.add(hit.join(":"));n++;
      if(hit[0]==="base")m.base[hit[1]]=Math.abs(val);else{const l=m.lv.find(x=>x.id===hit[1]);l.v=val;if(conf!=null)l.c=conf}}
    else if(cur&&GROUPS.includes(cur)){m.custom.push({g:cur,label,v:val,c:conf==null?1:conf});added++}
    else if(cur!=="sum")unrec.push(label)}
  if(!n&&!added)return{error:"noData"};
  if(!m.settings.units)m.settings.units=T.unitsDef;
  return{model:m,n,added,unrec,settings:found}
}

// Excel export plan. Columns: A section, B item, C value, D unit, E confidence, F weight, G EBITDA impact, H risk-weighted
function exportPlan(m,blank){
  const rows=[],f=[];const push=(r,fx)=>{rows.push(r);if(fx)f.push([rows.length,fx])};const s=m.settings;
  push([T.sheetTitle]);push([T.set.company,s.company&&!blank?s.company:""]);push([T.set.units,s.units]);
  push([T.set.varL,+s.varL]);const rVL=rows.length;push([T.set.varO,+s.varO]);const rVO=rows.length;push([T.set.bench,+s.bench]);const rB=rows.length;push([T.set.mult,+s.mult]);const rM=rows.length;push([]);
  // settings sit in column B for the label and C for the value: shift
  for(let i=1;i<rows.length;i++)if(rows[i].length===2)rows[i]=["",rows[i][0],rows[i][1]];
  push([T.col.section,T.col.item,T.col.val,T.col.unit,T.col.conf,T.col.w,T.col.imp,T.col.risk]);
  push([T.secs.base]);const br={};
  BASE.forEach(k=>{push([T.secs.base,T.base[k],blank?0:+m.base[k]||0,s.units]);br[k]=rows.length});
  push([T.calc,T.r.e0,null,s.units],[[2,`C${br.rev}-C${br.mat}-C${br.dl}-C${br.oc}-C${br.sga}`,"n"]]);const rE0=rows.length;
  const F={price:`C${br.rev}`,vol:`(C${br.rev}-C${br.mat}-C${br.dl}*C${rVL}/100-C${br.oc}*C${rVO}/100)`,mix:`C${br.rev}`,mat:`C${br.mat}`,scrap:`C${br.mat}`,lab:`C${br.dl}`,oh:`C${br.oc}`,sga:`C${br.sga}`,infl:`-(C${br.mat}+C${br.dl}+C${br.oc}+C${br.sga})`};
  const lvRows=[];const rowOf={};
  GROUPS.forEach(g=>{push([T.secs[g]]);
    m.lv.filter(l=>l.g===g).forEach(l=>{const w=l.id==="infl"?1:CONF_W[l.c];push([T.secs[g],T.lv[l.id],blank?0:+l.v||0,unitTxt(LEVERS.find(x=>x[0]===l.id)[2]),l.id==="infl"?"":T.conf[l.c],w],[[6,`${F[l.id]}*C{r}/100`,"n"],[7,`G{r}*F{r}`,"n"]]);lvRows.push(rows.length);rowOf[l.id]=rows.length});
    m.custom.filter(c=>c.g===g).forEach(c=>{push([T.secs[g],c.label||T.newLine,blank?0:+c.v||0,s.units,T.conf[c.c],CONF_W[c.c]],[[6,`C{r}`,"n"],[7,`G{r}*F{r}`,"n"]]);lvRows.push(rows.length)})});
  push([T.secs.sum]);
  const sumG=lvRows.map(r=>`G${r}`).join("+")||"0",sumH=lvRows.map(r=>`H${r}`).join("+")||"0";
  push([T.calc,T.r.up,null,s.units],[[2,sumG,"n"]]);const rUp=rows.length;
  push([T.calc,T.r.e1,null,s.units],[[2,`C${rE0}+C${rUp}`,"n"]]);const rE1=rows.length;
  push([T.calc,T.r.r1,null,s.units],[[2,`C${br.rev}*(1+C${rowOf.price}/100+C${rowOf.vol}/100)`,"n"]]);const rR1=rows.length;
  push([T.calc,T.r.m1,null,"%"],[[2,`IF(C${rR1}=0,0,C${rE1}/C${rR1})`,"pct"]]);
  push([T.calc,T.r.er,null,s.units],[[2,`C${rE0}+(${sumH})`,"n"]]);
  push([T.calc,T.r.val,null,s.units],[[2,`C${rUp}*C${rM}`,"n"]]);
  push([T.calc,T.r.valr,null,s.units],[[2,`(${sumH})*C${rM}`,"n"]]);
  return{rows,f}
}

<script>

  const h=ok?T.v.benchOk(pct(c.m1),pct(c.bench)):T.v.benchGap(pct(c.m1),pct(c.bench),pp(c.bench-(c.m1||0)));
  let sev=0;if(!ok||(c.mr!=null&&c.mr<c.bench)||c.lowShare>0.3||c.conc>0.4||c.inflShare>0.25)sev=1;
  if(c.up<=0||c.lowShare>0.4||c.conc>0.5||(c.m1!=null&&c.m1<c.bench-3))sev=2;
  return{sev,h,p:"",notes,top:c.pos.slice(0,3)}}
function kpiData(c){return[[T.k.e0,fmt(c.E0),T.k.margin(pct(c.m0)),false],[T.k.e1,fmt(c.E1),T.k.margin(pct(c.m1)),false],[T.k.up,sgn(c.up),T.k.riskUp(sgn(c.upR)),c.up<0],
  [T.k.er,fmt(c.Er),T.k.margin(pct(c.mr)),false],[T.k.val,sgn(c.val),T.k.at(pf.format(c.mult)),c.val<0],[T.k.gap,c.m1==null?"—":(c.m1-c.bench>=0?"+":"")+pp(c.m1-c.bench),T.k.bench(pct(c.bench)),c.m1!=null&&c.m1<c.bench]]}

function publish(c){try{const v=verdictData(c),S=model.settings;const out={id:"bridge",ts:Date.now(),sample:!!isSample,company:S.company||"",units:S.units||"",sev:v.sev,h:String(v.h||""),p:String((v.notes||[])[0]||v.p||""),act:String((v.top||[]).length?`${T.v.top}: ${v.top.map(x=>x.name).join(", ")}`:""),d:{E0:c.E0,E1:c.E1,Er:c.Er,up:c.up,upR:c.upR,val:c.val,valR:c.valR,m0:c.m0,m1:c.m1,bench:c.bench,mult:c.mult}};

function update(){const c=compute(model);publish(c);
  const set=(id,v,txt)=>{const el=$(id);if(!el)return;el.textContent=txt!=null?txt:fmt(v);el.classList.toggle("neg",v!=null&&Math.round(v)<0);el.classList.toggle("posv",v!=null&&Math.round(v)>0&&txt===undefined?false:false)};

    else{const idx=model.lv.findIndex(l=>l.id===x.key);set(`li-${idx}`,x.imp,Math.round(x.imp)?sgn(x.imp):"—");set(`lr-${idx}`,x.imp*x.w,Math.round(x.imp)?sgn(x.imp*x.w):"—")}});
  set("o-up",c.up,sgn(c.up));set("o-e1",c.E1);set("o-r1",c.R1);set("o-m1",null,pct(c.m1));set("o-er",c.Er);set("o-val",c.val,sgn(c.val));set("o-valr",c.valR,sgn(c.valR));
  $("kpis").innerHTML=kpiData(c).map(([l,v,s,bad])=>`<div class="kpi${bad?" bad":""}"><span class="label">${l}</span><b>${v}</b><small>${esc(s||"")}</small></div>`).join("");
  drawChart($("chart"),c,pagePal());
  const v=verdictData(c);const vd=$("verdict");
  if(v.sev<0){vd.innerHTML=`<span class="label">${T.v.label}</span><h2>${v.h}</h2><p>${v.p}</p><p class="cta">${T.v.cta}</p>`;return}
  vd.innerHTML=`<span class="label">${T.v.label}</span> <span class="sev" style="background:${["var(--good)","var(--warn)","var(--bad)"][v.sev]}">${T.v.sev[v.sev]}</span><h2>${v.h}</h2>${v.notes.length?`<ul>${v.notes.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}${v.top.length?`<span class="label">${T.v.top}</span><ul>${v.top.map(x=>`<li>${esc(x.name)}: ${sgn(x.imp)} ${esc(U())}</li>`).join("")}</ul>`:""}<p class="cta">${T.v.cta}</p>`}

const LIBS={xlsx:"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",jspdf:"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"};
const loaded={};function lib(k){return loaded[k]||(loaded[k]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=LIBS[k];s.onload=res;s.onerror=()=>{loaded[k]=null;rej(new Error("load"))};document.head.appendChild(s)}))}
const browserDl={save:async({filename,data})=>{const url=URL.createObjectURL(new Blob([data]));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return{status:"saved"}}};
let dl=null;const dlReady=window.claude&&window.claude.use?window.claude.use("downloads").then(d=>{dl=d||browserDl}).catch(()=>{dl=browserDl}):(dl=browserDl,Promise.resolve());
function disableDl(){["btnTemplate","btnXlsx","btnPdf"].forEach(id=>{$(id).disabled=true;$(id).title=T.st.noDl})}
async function offer(filename,data,okMsg){await dlReady;if(!dl){status(T.st.noDl,"err");return}
  status(okMsg);try{await dl.save({filename,data});status(T.st.saved,"ok")}
  catch(e){const code=e&&e.code;status(code==="declined"?T.st.declined:code==="unavailable"||code==="not_granted"?T.st.noDl:T.st.fail,code==="declined"?"":"err")}}
const fname=ext=>`${(model.settings.company||"DeXM").replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"")||"DeXM"}-EBITDA-bridge.${ext}`;

async function buildXlsx(blank){status(T.st.loading);await lib("xlsx");
  const m=blank?Object.assign(blankModel(),{custom:[]}):model;const {rows,f}=exportPlan(m,blank);
  const ws=XLSX.utils.aoa_to_sheet(rows);
  f.forEach(([r,list])=>list.forEach(([ci,fx,kind])=>{const addr=XLSX.utils.encode_cell({r:r-1,c:ci});ws[addr]={t:"n",f:fx.replace(/\{r\}/g,r),z:kind==="pct"?"0.0%":"#,##0;(#,##0)"}}));
  ws["!cols"]=[{wch:22},{wch:52},{wch:12},{wch:9},{wch:12},{wch:8},{wch:16},{wch:16}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"EBITDA bridge");
  return XLSX.write(wb,{bookType:"xlsx",type:"array"})}

$("importFile").addEventListener("change",async e=>{const file=e.target.files[0];e.target.value="";if(!file)return;
  try{status(T.st.loading);await lib("xlsx");const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});

function reportPages(){
  const c=compute(model),s=model.settings,v=verdictData(c),PW=1500,PH=1060,SC=2,M=50,CW=PW-2*M;
  const F={sans:'"IBM Plex Sans","Segoe UI",Arial,sans-serif',mono:'"IBM Plex Mono",Menlo,monospace',disp:'"Archivo","Helvetica Neue",Arial,sans-serif'};
  const P={fg:"#1b2224",muted:"#5d686b",line:"#d6dbd9",band:"#eef1ef",acc:"#0e6b6b",accSoft:"#dcecea",bad:"#b4442d",good:"#2f7d4f",warn:"#b7791f",steel:"#3c4a4f"};
  const pages=[];
  const newPage=()=>{const cv=document.createElement("canvas");cv.width=PW*SC;cv.height=PH*SC;const g=cv.getContext("2d");g.scale(SC,SC);g.fillStyle="#fff";g.fillRect(0,0,PW,PH);pages.push(cv);return g};
  const foot=(g,n)=>{g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.textAlign="left";g.fillText("DeXM Management · info@dexm-m.com · +1 917 523 0461 · dexm-m.com",M,PH-28);g.textAlign="right";g.fillText(String(n),PW-M,PH-28);g.textAlign="left"};
  const wrap=(g,text,x,y,maxW,lh)=>{const words=String(text).replace(/<[^>]+>/g,"").split(" ");let line="";for(const w of words){const t=line?line+" "+w:w;if(g.measureText(t).width>maxW&&line){g.fillText(line,x,y);y+=lh;line=w}else line=t}if(line){g.fillText(line,x,y);y+=lh}return y};
  const clip=(g,text,maxW)=>{text=String(text);if(g.measureText(text).width<=maxW)return text;while(text.length>1&&g.measureText(text+"…").width>maxW)text=text.slice(0,-1);return text+"…"};
  let g=newPage(),y=M+24;
  g.fillStyle=P.fg;g.font=`800 30px ${F.disp}`;g.fillText(T.sheetTitle,M,y);y+=28;
  g.font=`14px ${F.sans}`;g.fillStyle=P.muted;g.fillText([s.company,`${T.set.units.replace(/,.*/,"")}: ${U()}`,`${T.set.mult.replace(/,.*/,"")}: ${pf.format(+s.mult||0)}x`,`${T.prepared}: ${new Date().toLocaleDateString(loc)}`].filter(Boolean).join("   ·   "),M,y);y+=14;
  g.fillStyle=P.fg;g.fillRect(M,y,CW,2);y+=22;
  const kw=(CW-5*12)/6;kpiData(c).forEach(([l,val,sub,bad],i)=>{const x=M+i*(kw+12);g.strokeStyle=P.line;g.lineWidth=1;g.strokeRect(x+.5,y+.5,kw,78);
    g.font=`500 11px ${F.mono}`;g.fillStyle=P.muted;g.fillText(clip(g,l.toUpperCase(),kw-20),x+10,y+20);
    g.font=`600 24px ${F.mono}`;g.fillStyle=bad?P.bad:P.fg;g.fillText(clip(g,val,kw-20),x+10,y+50);g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.fillText(clip(g,sub||"",kw-20),x+10,y+68)});
  y+=104;const vy=y;
  g.font=`700 19px ${F.disp}`;g.fillStyle=P.fg;y=wrap(g,v.h,M+18,y+18,CW-30,24);
  g.font=`13px ${F.sans}`;g.fillStyle=P.fg;v.notes.forEach(t=>{y=wrap(g,"•  "+t,M+18,y+2,CW-40,19)});
  if(v.top.length){g.font=`600 13px ${F.sans}`;g.fillText(T.v.top,M+18,y+8);y+=28;g.font=`13px ${F.sans}`;v.top.forEach(x=>{y=wrap(g,`•  ${x.name}: ${sgn(x.imp)} ${U()}`,M+18,y,CW-40,19)})}
  g.fillStyle=v.sev<0?P.muted:[P.good,P.warn,P.bad][v.sev];g.fillRect(M,vy,5,y-vy);y+=20;
  const ch=Math.max(240,PH-y-70),cc=document.createElement("canvas");
  drawChart(cc,c,{fg:P.fg,muted:P.muted,line:P.line,good:P.good,bad:P.bad,accent:P.acc,steel:P.steel,surface:"#fff",mono:F.mono},CW,ch,SC);
  g.drawImage(cc,M,y,CW,ch);foot(g,1);
  // page 2: table
  g=newPage();g.fillStyle=P.fg;g.font=`700 18px ${F.disp}`;g.fillText(T.sheetTitle+(s.company?` · ${s.company}`:""),M,M+14);
  g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.fillText(`${T.set.units.replace(/,.*/,"")}: ${U()}`,M,M+32);
  const cols=[[T.col.item,560,"l"],[T.col.val,150,"r"],[T.col.unit,90,"l"],[T.col.conf,170,"l"],[T.col.imp,215,"r"],[T.col.risk,215,"r"]];
  let ty=M+52;const RH=22;
  const cell=(vals,kind)=>{if(kind==="sec"){g.fillStyle=P.band;g.fillRect(M,ty,CW,RH);g.fillStyle=P.fg;g.font=`600 12px ${F.sans}`;g.textAlign="left";g.fillText(String(vals[0]).toUpperCase(),M+6,ty+15);ty+=RH;return}
    if(kind==="key"){g.fillStyle=P.accSoft;g.fillRect(M,ty,CW,RH)}
    let x=M;cols.forEach(([,w,al],i)=>{const t=vals[i]==null?"":String(vals[i]);const bold=kind==="key"||kind==="sub"||kind==="head";
      g.font=`${bold?"600 ":""}${i===0||i===3?"12.5px "+F.sans:"12px "+F.mono}`;g.fillStyle=kind==="head"?P.muted:(t.startsWith("(")?P.bad:t.startsWith("+")&&i>=4?P.good:P.fg);
      if(al==="r"){g.textAlign="right";g.fillText(clip(g,t,w-12),x+w-6,ty+15)}else{g.textAlign="left";g.fillText(clip(g,t,w-12),x+6,ty+15)}x+=w});
    g.fillStyle=kind==="head"?P.fg:P.line;g.fillRect(M,ty+RH-1,CW,kind==="head"?1.5:1);ty+=RH};
  cell(cols.map(c=>c[0]),"head");
  cell([T.secs.base],"sec");BASE.forEach(k=>cell([T.base[k],fmt(+model.base[k]||0),U()]));
  cell([T.r.e0,fmt(c.E0),U()],"key");cell([T.r.m0,pct(c.m0),""]);
  GROUPS.forEach(gname=>{cell([T.secs[gname]],"sec");c.items.filter(x=>x.g===gname).forEach(x=>{
    const val=x.custom?fmt(x.val):pf.format(x.val);
    const unit=x.custom?U():unitTxt(LEVERS.find(l=>l[0]===x.key)[2]);
    cell([x.full,val,unit,x.isInfl?"100%":T.conf[x.c],Math.round(x.imp)?sgn(x.imp):"—",Math.round(x.imp)?sgn(x.imp*x.w):"—"])})});
  cell([T.secs.sum],"sec");
  cell([T.r.up,sgn(c.up),U()],"sub");cell([T.r.e1,fmt(c.E1),U()],"key");cell([T.r.r1,fmt(c.R1),U()]);cell([T.r.m1,pct(c.m1),""]);
  cell([T.r.er,fmt(c.Er),U()],"sub");cell([T.r.val,sgn(c.val),U()],"key");cell([T.r.valr,sgn(c.valR),U()]);
  g.textAlign="left";foot(g,2);
  return pages}
$("btnPdf").onclick=async()=>{try{status(T.st.loading);await lib("jspdf");if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const pages=reportPages();const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
  const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
  pages.forEach((cv,i)=>{if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,pw,ph)});
  await offer(fname("pdf"),pdf.output("arraybuffer"),T.st.pdf)}catch(e){console.error(e);status(T.st.fail,"err")}};

texts();renderSettings();renderGrid();$("sample").hidden=!isSample;
})()}
