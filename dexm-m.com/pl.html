<style>

:root{

  --body:"IBM Plex Sans","Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131819; --surface:#1b2224; --fg:#e6ebea; --muted:#9aa6a8; --line:#2e3739;
  --accent:#4fb3ad; --accent-soft:#1f3534; --steel:#b9c5c7; --band:#20292b;
  --good:#5fbf86; --warn:#e0a84a; --bad:#e2765f; --bad-soft:#3a2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131819; --surface:#1b2224; --fg:#e6ebea; --muted:#9aa6a8; --line:#2e3739;
  --accent:#4fb3ad; --accent-soft:#1f3534; --steel:#b9c5c7; --band:#20292b;
  --good:#5fbf86; --warn:#e0a84a; --bad:#e2765f; --bad-soft:#3a2420; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
header{border-bottom:2px solid var(--fg);padding-bottom:14px}
.brand{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(26px,4vw,38px)/1.1 var(--display);margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
.lede{max-width:72ch;color:var(--muted);margin:8px 0 0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.filebtn{font:500 14px var(--body);border-radius:4px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center}
button.primary,.filebtn{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.filebtn:focus-within,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.status{font-size:13px;color:var(--muted);min-height:1.2em;flex-basis:100%}
.status.ok{color:var(--good)} .status.err{color:var(--bad)}
.notice{font-size:13px;background:var(--accent-soft);padding:10px 12px;border-radius:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.label{font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input{font:15px var(--body);padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
.field input.num{font-family:var(--mono);text-align:right}
.summary{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.summary{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font:600 20px/1.2 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)}
canvas{width:100%;height:240px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}
.verdict h2{font:700 21px/1.25 var(--display);margin:8px 0 6px;text-wrap:balance}
.verdict p{margin:0 0 8px;font-size:14px;color:var(--muted)}
.verdict ul{margin:4px 0 10px;padding-left:18px;font-size:14px;display:grid;gap:3px}
.sev{display:inline-block;font:500 12px var(--mono);padding:2px 8px;border-radius:3px;color:var(--surface)}
.cta{border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
th,td{padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{font:500 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 6px;text-align:right;background:var(--surface);position:sticky;top:0}
thead th small{display:block;font-size:11px;letter-spacing:0;text-transform:none}
th.lab,td.lab{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:6px 10px;min-width:230px;max-width:280px;border-right:1px solid var(--line)}
thead th.lab{z-index:2}
td.lab{white-space:normal}
td.lab input{font:13px var(--body);border:1px dashed var(--line);border-radius:3px;padding:3px 6px;background:var(--bg);color:var(--fg);width:calc(100% - 30px)}
td.lab .del{padding:0 6px;margin-left:4px;font-size:15px;line-height:1.4;border:0;background:none;color:var(--muted)}
td.v{text-align:right;padding:0 2px}
td.v input{width:84px;font:13px var(--mono);text-align:right;border:1px solid transparent;border-radius:3px;padding:5px 6px;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums}
td.v input:hover{border-color:var(--line)}
td.c{text-align:right;padding:6px 8px;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.tot{font-weight:600;background:var(--band)}
tr.sec td{background:var(--band);font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:8px 10px}
tr.sec td.lab{background:var(--band)}
tr.sub td{font-weight:600}
tr.key td{font-weight:600;background:var(--accent-soft)}
tr.key td.lab{background:var(--accent-soft)}
tr.pct td{color:var(--muted);font-style:italic}
tr.pct td.below{font-style:normal}
td.neg{color:var(--bad)}
td.below{background:var(--bad-soft)!important;color:var(--bad)}
tr.add td{padding:4px 10px;border-bottom:1px solid var(--line)}
tr.add button{font-size:12px;padding:3px 8px;border-style:dashed;background:none;color:var(--accent)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
footer{padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
footer span{user-select:all}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 ["da",/(depreciation|amortization|\bd&a\b|амортиз)/i],
 ["int",/(interest|процент)/i],
 ["oopex",/(other operating|other opex|прочие операц)/i],
 ["oth",/(other income|other expense|non-?operating|прочие доходы|прочие расходы|внереализ)/i],
 ["tax",/(income tax|налог на прибыль|\btax\b|налог)/i],

 ["lab",/(direct labor|labou?r|wage|труд|производственный персонал)/i],
 ["ener",/(energy|electric|power|utilit|энерг|электр|коммунал)/i],

const SEC_RE=[["cogs",/(cost of|cogs|себестоим)/i],["opex",/(operating exp|opex|sg&a|операционные расх|коммерческие и управ)/i],["below",/(below|non-?operat|other income|financ|ниже ebitda|прочие|финансов)/i],["rev",/(revenue|sales|выручк|продаж)/i]];
const CALC_RE=/(итого|total|gross profit|валовая прибыль|ebitda|\bebit\b|ebt|pre-?tax|до налог|net income|чистая прибыль|margin|маржа|net revenue|чистая выручка|operating income|операционная прибыль)/i;
const ALL_LABELS={};["ru","en"].forEach(l=>Object.entries(L[l].lines).forEach(([k,v])=>ALL_LABELS[v.toLowerCase()]=k));
const MONTH_RE=[/^(jan|янв)/i,/^(feb|фев)/i,/^(mar|мар)/i,/^(apr|апр)/i,/^(may|мая|май)/i,/^(jun|июн)/i,/^(jul|июл)/i,/^(aug|авг)/i,/^(sep|сен)/i,/^(oct|окт)/i,/^(nov|ноя)/i,/^(dec|дек)/i];
const PER_RE=/^(month|mon|m|p|period|месяц|мес|период)\.?\s*(\d{1,2})\b/i;

function thisJan(){return `${new Date().getFullYear()}-01`}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function monthLabel(start,i){const [y,m]=(start||thisJan()).split("-").map(Number);if(!y||!m)return `${T.per} ${i+1}`;const d=new Date(y,m-1+i,1);return `${T.months[d.getMonth()]} ${d.getFullYear()}`}
const zeros=()=>Array(W).fill(0);
function blankModel(){return{settings:{company:"",start:thisJan(),units:T.unitsDef,benchGM:25,benchE:12},lines:BUILT.map(([id,sec])=>({id,sec,vals:zeros()}))}}
function sampleModel(){const m=blankModel();m.settings.company=T.companyDef;m.settings.benchGM=28;m.settings.benchE=14;
  const S=[2350,2420,2610,2580,2650,2700,2520,2280,2640,2710,2600,2310];const R=x=>Math.round(x);
  const V={sales:S,svc:S.map(()=>60),disc:S.map(s=>R(s*.03)),mat:S.map(s=>R(s*.5)),lab:S.map(s=>R(260+s*.03)),ener:S.map(s=>R(s*.04)),moh:S.map(()=>110),frt:S.map(s=>R(s*.03)),
   sm:S.map(s=>R(s*.035)),ga:S.map(()=>150),rent:S.map(()=>45),oopex:S.map(()=>30),da:S.map(()=>70),int:S.map(()=>35),oth:[0,0,5,0,0,-20,0,0,0,10,0,0],tax:zeros()};
  m.lines.forEach(l=>l.vals=V[l.id].slice());const c=compute(m);m.lines.find(l=>l.id==="tax").vals=c.ebt.map(x=>R(Math.max(0,x)*.25));return m}
const labelOf=l=>l.id?T.lines[l.id]:(l.label||T.newLine);
const sum12=a=>a.reduce((x,y)=>x+(+y||0),0);

function compute(m){
  const by=(sec,f)=>{const a=zeros();m.lines.filter(l=>l.sec===sec&&(!f||f(l))).forEach(l=>{const s=signOf(l);l.vals.forEach((v,i)=>a[i]+=s*(+v||0))});return a};
  const rev=by("rev"),cogs=by("cogs").map(x=>-x),opex=by("opex").map(x=>-x);
  const gp=rev.map((v,i)=>v-cogs[i]),ebitda=gp.map((v,i)=>v-opex[i]);
  const da=zeros();m.lines.filter(l=>l.id==="da").forEach(l=>l.vals.forEach((v,i)=>da[i]+=+v||0));
  const tax=zeros();m.lines.filter(l=>l.id==="tax").forEach(l=>l.vals.forEach((v,i)=>tax[i]+=+v||0));
  const fin=by("below",l=>l.id!=="da"&&l.id!=="tax");
  const ebit=ebitda.map((v,i)=>v-da[i]),ebt=ebit.map((v,i)=>v+fin[i]),ni=ebt.map((v,i)=>v-tax[i]);
  const pct=(a,b)=>a.map((v,i)=>b[i]?v/b[i]*100:null);
  const T_={rev:sum12(rev),cogs:sum12(cogs),gp:sum12(gp),opex:sum12(opex),ebitda:sum12(ebitda),ebit:sum12(ebit),ebt:sum12(ebt),ni:sum12(ni)};
  const P=(a,b)=>b?a/b*100:null;
  const gmY=P(T_.gp,T_.rev),emY=P(T_.ebitda,T_.rev),nmY=P(T_.ni,T_.rev);
  const bE=+m.settings.benchE||0,bG=+m.settings.benchGM||0;
  const upside=T_.rev?Math.max(0,(bE-(emY||0))/100*T_.rev):0;
  const negM=ebitda.filter((v,i)=>v<0&&(rev[i]||ebitda[i])).length;
  const h1=sum12(rev.slice(0,6)),h2=sum12(rev.slice(6));
  const mat=m.lines.find(l=>l.id==="mat");const matShare=T_.rev&&mat?sum12(mat.vals)/T_.rev*100:null;
  return{rev,cogs,gp,opex,ebitda,da,ebit,ebt,tax,ni,gm:pct(gp,rev),em:pct(ebitda,rev),nm:pct(ni,rev),tot:T_,gmY,emY,nmY,bE,bG,upside,negM,half:h1?(h2/h1-1)*100:null,matShare};
}

function parseNum(x){if(typeof x==="number")return isFinite(x)?x:null;if(x==null)return null;
  let s=String(x).trim().replace(/[\s $€£₽]/g,"");if(!s||s==="-"||s==="—")return null;
  let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(s.includes(",")&&s.includes("."))s=s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");
  else if(s.includes(","))s=/,\d{3}$/.test(s)&&!/,\d{3},?\d{1,2}$/.test(s)?s.replace(/,/g,""):s.replace(",",".");
  const n=parseFloat(s);return isFinite(n)?(neg?-n:n):null}

// header cell -> {kind:"num",n} | {kind:"month",m,y} | null
function perCell(c){
  if(c instanceof Date&&!isNaN(c))return{kind:"month",m:c.getMonth(),y:c.getFullYear()};
  const t=String(c==null?"":c).trim();if(!t)return null;
  let mm=t.match(PER_RE);if(mm){const n=+mm[2];return n>=1&&n<=W?{kind:"num",n}:null}
  mm=t.match(/^(\d{4})-(\d{2})/);if(mm)return{kind:"month",m:+mm[2]-1,y:+mm[1]};
  for(let i=0;i<12;i++)if(MONTH_RE[i].test(t)){const y=t.match(/(\d{4})/);const y2=t.match(/['’\-\s](\d{2})$/);return{kind:"month",m:i,y:y?+y[1]:(y2?2000+ +y2[1]:null)}}
  return null}

function importAOA(rows){
  let hdr=-1,cols=[],firstCell=null;
  for(let r=0;r<Math.min(rows.length,60);r++){const hits=[];(rows[r]||[]).forEach((c,ci)=>{const p=perCell(c);if(p)hits.push([ci,p])});
    if(hits.length>=6){hdr=r;const nums=hits.filter(h=>h[1].kind==="num");
      if(nums.length>=6){const byN={};nums.forEach(([ci,p])=>{if(byN[p.n]==null)byN[p.n]=ci});cols=[...Array(W)].map((_,i)=>byN[i+1])}
      else{cols=hits.filter(h=>h[1].kind==="month").slice(0,W).map(h=>h[0]);firstCell=hits.find(h=>h[1].kind==="month")[1]}
      break}}
  if(hdr<0)return{error:"noHeader"};
  const first=Math.min(...cols.filter(x=>x!=null));
  const model=blankModel();model.settings.units="";const found=[];
  if(firstCell){model.settings.start=`${firstCell.y||new Date().getFullYear()}-${String(firstCell.m+1).padStart(2,"0")}`;found.push("start")}
  const txt=c=>c==null?"":String(c).trim();
  const SET=[["benchGM",/(gross margin bench|бенчмарк валовой)/i],["benchE",/(ebitda bench|бенчмарк ebitda)/i],["start",/(first month|первый месяц|fiscal year start|начало года)/i],["company",/(company|компания)/i],["units",/(units|единиц)/i]];
  for(let r=0;r<hdr;r++){const row=rows[r]||[];row.forEach((c,ci)=>{const t=txt(c);if(!t||typeof c==="number")return;
      for(const [k,re] of SET){if(re.test(t)&&!found.includes(k)){const rest=row.slice(ci+1).filter(x=>x!=null&&txt(x)!=="");if(!rest.length)continue;let v=rest[0];
          if(k==="start"){const p=perCell(v);if(!p||p.kind!=="month")continue;v=`${p.y||new Date().getFullYear()}-${String(p.m+1).padStart(2,"0")}`}
          else if(k==="company"||k==="units")v=txt(v);else{v=parseNum(v);if(v==null)continue;if(Math.abs(v)<=1&&v!==0)v=v*100}
          model.settings[k]=v;found.push(k);break}}})}
  if(!model.settings.units)model.settings.units=T.unitsDef;
  let curSec=null,n=0,added=0;const unrec=[],hit=new Set();
  const secOf=t=>{for(const [k,re] of SEC_RE)if(re.test(t))return k;return null};
  for(let r=hdr+1;r<rows.length;r++){const row=rows[r]||[];
    const left=row.slice(0,first).map(txt);const nonEmpty=left.filter(Boolean);if(!nonEmpty.length)continue;
    const label=left[first-1]||nonEmpty[nonEmpty.length-1];const secText=nonEmpty.length>1?nonEmpty[0]:"";
    if(left.some(t=>/^(расч|calc)/i.test(t)))continue;
    const filled=cols.some(ci=>ci!=null&&row[ci]!=null&&txt(row[ci])!=="");
    if(!filled){const s=secOf(label);if(s)curSec=s;continue}
    if(CALC_RE.test(label)&&!ALL_LABELS[label.toLowerCase()])continue;
    const vals=cols.map(ci=>{const v=ci!=null?parseNum(row[ci]):null;return v==null?0:v});const has=vals.some(v=>v!==0);
    const sec=(secText&&secOf(secText))||curSec;
    let id=ALL_LABELS[label.toLowerCase()];
    if(!id&&/(cost of|cogs|себестоим)/i.test(label)){model.lines.push({id:null,sec:"cogs",label,vals:vals.map(Math.abs)});added++;continue}
    if(!id)for(const [k,re] of ALIAS)if(re.test(label)){id=k;break}
    if(id){const line=model.lines.find(l=>l.id===id);line.vals=line.vals.map((v,i)=>v+(SIGNED(id)?vals[i]:Math.abs(vals[i])));if(!hit.has(id)){hit.add(id);n++}}
    else if(sec){model.lines.push({id:null,sec,label,vals:vals.map(Math.abs)});added++}
    else if(has)unrec.push(label)}
  model.lines.sort((a,b)=>SECS.indexOf(a.sec)-SECS.indexOf(b.sec));
  return{model,n,added,unrec,settings:found}
}

// Excel export: rows + formulas. Columns: A section, B line, C..N months, O FY total
function exportPlan(m,blank){
  const col=i=>String.fromCharCode(67+i);const cols=[...Array(W+1)].map((_,i)=>i);
  const rows=[],f=[];const push=(r,formulas)=>{rows.push(r);if(formulas)f.push([rows.length,formulas])};
  push([T.sheetTitle]);push([T.company,"",blank?"":m.settings.company]);push([T.units,"",m.settings.units]);
  push([T.start,"",monthLabel(m.settings.start,0)]);push([T.benchGM,"",+m.settings.benchGM||0]);push([T.benchE,"",+m.settings.benchE||0]);push([]);
  push([T.section,T.line,...[...Array(W)].map((_,i)=>monthLabel(m.settings.start,i)),T.total]);
  const lineRows={rev:[],cogs:[],opex:[],below:[]};const idRow={};const sub={};
  const expr=(list,c)=>list.length?list.map(([r,s],j)=>`${s<0?"-":(j?"+":"")}${c}${r}`).join(""):"0";
  const calcRow=(label,fn,pct)=>{push([T.calc,label,...zeros(),null],cols.map(i=>[i,fn(col(i))]).map(x=>pct?[...x,"pct"]:x));return rows.length};
  SECS.forEach(s=>{push([T.sec[s]]);
    m.lines.filter(l=>l.sec===s).forEach(l=>{push([T.sec[s],labelOf(l),...(blank?zeros():l.vals.map(v=>+v||0)),null],[[W,`SUM(C{r}:N{r})`]]);lineRows[s].push([rows.length,signOf(l),l.id]);if(l.id)idRow[l.id]=rows.length});
    if(s==="rev")sub.rev=calcRow(T.r.rev,c=>expr(lineRows.rev,c));
    if(s==="cogs"){sub.cogs=calcRow(T.r.cogs,c=>expr(lineRows.cogs.map(([r])=>[r,1]),c));
      sub.gp=calcRow(T.r.gp,c=>`${c}${sub.rev}-${c}${sub.cogs}`);calcRow(T.r.gm,c=>`IF(${c}${sub.rev}=0,0,${c}${sub.gp}/${c}${sub.rev})`,1)}
    if(s==="opex"){sub.opex=calcRow(T.r.opex,c=>expr(lineRows.opex.map(([r])=>[r,1]),c));
      sub.ebitda=calcRow(T.r.ebitda,c=>`${c}${sub.gp}-${c}${sub.opex}`);calcRow(T.r.em,c=>`IF(${c}${sub.rev}=0,0,${c}${sub.ebitda}/${c}${sub.rev})`,1)}
    if(s==="below"){const das=lineRows.below.filter(x=>x[2]==="da"),taxes=lineRows.below.filter(x=>x[2]==="tax"),fin=lineRows.below.filter(x=>x[2]!=="da"&&x[2]!=="tax");
      sub.ebit=calcRow(T.r.ebit,c=>`${c}${sub.ebitda}`+das.map(([r])=>`-${c}${r}`).join(""));
      sub.ebt=calcRow(T.r.ebt,c=>`${c}${sub.ebit}`+fin.map(([r,sg])=>`${sg<0?"-":"+"}${c}${r}`).join(""));
      sub.ni=calcRow(T.r.ni,c=>`${c}${sub.ebt}`+taxes.map(([r])=>`-${c}${r}`).join(""));
      calcRow(T.r.nm,c=>`IF(${c}${sub.rev}=0,0,${c}${sub.ni}/${c}${sub.rev})`,1)}
  });
  return{rows,f};
}

<script>

function drawChart(cv,c,pal,wpx,hpx,scale){
  const dpr=scale||window.devicePixelRatio||1;const w=wpx||cv.clientWidth||600,hgt=hpx||cv.clientHeight||240;
  cv.width=w*dpr;cv.height=hgt*dpr;const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,hgt);
  const padL=58,padR=48,padT=12,padB=26;
  let lo=Math.min(0,...c.ebitda),hi=Math.max(0,...c.ebitda);if(hi===lo)hi=lo+1;const sp=hi-lo;hi+=sp*.1;if(lo<0)lo-=sp*.1;
  const ems=c.em.filter(v=>v!=null);let phi=Math.min(60,Math.max(c.bE,1,...ems.filter(v=>v>0))*1.25);
  let plo=hi>0?-phi*(-lo)/hi:Math.min(-5,...ems);plo=Math.max(plo,-60);const clampP=v=>Math.max(plo,Math.min(phi,v));
  const H=hgt-padT-padB,y=v=>padT+(hi-v)/(hi-lo)*H,yp=v=>padT+(phi-clampP(v))/(phi-plo)*H;
  const bw=(w-padL-padR)/W,x=i=>padL+bw*i+bw/2;
  g.font=`11px ${pal.mono}`;g.lineWidth=1;g.textBaseline="middle";
  const st=niceStep((hi-lo)/4);g.textAlign="right";for(let t=Math.ceil(lo/st)*st;t<=hi+1e-9;t+=st){g.strokeStyle=pal.line;g.beginPath();g.moveTo(padL,y(t)+.5);g.lineTo(w-padR,y(t)+.5);g.stroke();g.fillStyle=pal.muted;g.fillText(fmt(t),padL-6,y(t))}
  const pst=niceStep((phi-plo)/4);g.textAlign="left";for(let t=Math.ceil(plo/pst)*pst;t<=phi+1e-9;t+=pst){g.fillStyle=pal.muted;g.fillText(`${Math.round(t)}%`,w-padR+6,yp(t))}
  c.ebitda.forEach((v,i)=>{g.fillStyle=v>=0?pal.good:pal.bad;g.globalAlpha=.5;const y0=y(0),y1=y(v);g.fillRect(x(i)-bw*.3,Math.min(y0,y1),bw*.6,Math.max(1,Math.abs(y1-y0)))});g.globalAlpha=1;
  g.strokeStyle=pal.warn;g.setLineDash([5,4]);g.lineWidth=1.5;g.beginPath();g.moveTo(padL,yp(c.bE));g.lineTo(w-padR,yp(c.bE));g.stroke();g.setLineDash([]);
  g.strokeStyle=pal.accent;g.lineWidth=2.5;g.beginPath();let started=false;c.em.forEach((v,i)=>{if(v==null)return;started?g.lineTo(x(i),yp(v)):g.moveTo(x(i),yp(v));started=true});g.stroke();
  c.em.forEach((v,i)=>{if(v==null)return;g.beginPath();g.arc(x(i),yp(v),3.2,0,7);g.fillStyle=v<c.bE?pal.bad:pal.accent;g.fill();g.strokeStyle=pal.surface;g.lineWidth=1.5;g.stroke()});
  g.fillStyle=pal.muted;g.textAlign="center";g.textBaseline="top";
  // Month labels: full names when they fit, first letter on narrow charts (phones), else every Nth label
  const labs=[...Array(W)].map((_,i)=>monthLabel(model.settings.start,i).split(" ")[0]);
  const fits=a=>Math.max(...a.map(t=>g.measureText(t).width))+6<=bw;
  let shown=labs,step=1;if(!fits(labs)){const ini=labs.map(t=>t.charAt(0));if(fits(ini))shown=ini;else step=Math.ceil((Math.max(...labs.map(t=>g.measureText(t).width))+6)/bw)}
  for(let i=0;i<W;i+=step)g.fillText(shown[i],x(i),hgt-padB+8)}
const pagePal=()=>({fg:css("--fg"),muted:css("--muted"),line:css("--line"),good:css("--good"),bad:css("--bad"),warn:css("--warn"),accent:css("--accent"),surface:css("--surface"),mono:css("--mono")});

function verdictData(c){const gap=(c.emY||0)-c.bE,notes=[];
  if(c.gmY!=null)notes.push(c.gmY<c.bG?T.v.gmLow(pct(c.gmY),pct(c.bG)):T.v.gmOk(pct(c.gmY),pct(c.bG)));
  if(c.negM)notes.push(T.v.negM(c.negM));
  if(c.half!=null)notes.push(T.v.half(`${c.half>=0?"+":""}${pf.format(c.half)}%`));
  if(c.matShare)notes.push(T.v.matShare(pct(c.matShare)));
  const levers=c.gmY!=null&&c.gmY<c.bG?T.v.Lgm:T.v.Lop;
  if(!c.tot.rev)return{sev:0,h:"—",p:"",notes:[],levers:[]};
  if(c.tot.ebitda<0)return{sev:2,h:T.v.loss,p:T.v.lossP(fmtU(c.upside)),notes,levers};
  if(gap>=0)return{sev:0,h:T.v.ok,p:T.v.okP(pct(c.emY),pct(c.bE)),notes,levers:[]};
  if(gap>-5)return{sev:1,h:T.v.warn(pp(-gap)),p:T.v.warnP(fmtU(c.upside)),notes,levers};
  return{sev:2,h:T.v.crit(pp(-gap)),p:T.v.critP(fmtU(c.upside)),notes,levers}}
function kpiData(c){const u=model.settings.units;return[
  [T.k.rev,fmt(c.tot.rev),u,false],[T.k.gm,pct(c.gmY),T.k.vsB(pct(c.bG)),c.gmY!=null&&c.gmY<c.bG],
  [T.k.ebitda,fmt(c.tot.ebitda),u,c.tot.ebitda<0],[T.k.em,pct(c.emY),T.k.vsB(pct(c.bE)),c.emY!=null&&c.emY<c.bE],
  [T.k.ni,fmt(c.tot.ni),`${u} · ${pct(c.nmY)}`,c.tot.ni<0],[T.k.up,fmt(c.upside),c.negM?T.k.neg(c.negM):u,c.upside>0]]}

function update(){const c=compute(model);
  const set=(id,v,isPct,bad)=>{const el=$(id);if(!el)return;el.textContent=isPct?pct(v):fmt(v);el.classList.toggle("neg",v!=null&&v<0);if(bad!=null)el.classList.toggle("below",bad)};
  ["rev","cogs","gp","opex","ebitda","ebit","ebt","ni"].forEach(k=>{c[k].forEach((v,i)=>set(`c-${k}-${i}`,v));set(`c-${k}-t`,c.tot[k])});
  c.gm.forEach((v,i)=>set(`c-gm-${i}`,v,1));set("c-gm-t",c.gmY,1);
  c.em.forEach((v,i)=>set(`c-em-${i}`,v,1,v!=null&&v<c.bE));set("c-em-t",c.emY,1,c.emY!=null&&c.emY<c.bE);
  c.nm.forEach((v,i)=>set(`c-nm-${i}`,v,1));set("c-nm-t",c.nmY,1);
  model.lines.forEach((l,li)=>set(`lt-${li}`,sum12(l.vals)));
  $("kpis").innerHTML=kpiData(c).map(([l,v,s,bad])=>`<div class="kpi${bad?" bad":""}"><span class="label">${l}</span><b>${v}</b><small>${esc(s||"")}</small></div>`).join("");
  drawChart($("chart"),c,pagePal());
  const v=verdictData(c);const sevC=["var(--good)","var(--warn)","var(--bad)"][v.sev];
  $("verdict").innerHTML=`<span class="label">${T.v.label}</span> <span class="sev" style="background:${sevC}">${T.v.sev[v.sev]}</span><h2>${v.h}</h2><p>${v.p}</p>${v.notes.length?`<ul>${v.notes.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}${v.levers.length?`<span class="label">${T.v.levers}</span><ul>${v.levers.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}<p class="cta">${T.v.cta}</p>`}
const redraw=()=>drawChart($("chart"),compute(model),pagePal());
window.addEventListener("resize",redraw);
const mq=window.matchMedia("(prefers-color-scheme: dark)");mq.addEventListener&&mq.addEventListener("change",redraw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

const LIBS={xlsx:"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",jspdf:"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"};
const loaded={};function lib(k){return loaded[k]||(loaded[k]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=LIBS[k];s.onload=res;s.onerror=()=>{loaded[k]=null;rej(new Error("load"))};document.head.appendChild(s)}))}
const browserDl={save:async({filename,data})=>{const url=URL.createObjectURL(new Blob([data]));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return{status:"saved"}}};
let dl=null;const dlReady=window.claude&&window.claude.use?window.claude.use("downloads").then(d=>{dl=d||browserDl}).catch(()=>{dl=browserDl}):(dl=browserDl,Promise.resolve());
function disableDl(){["btnTemplate","btnXlsx","btnPdf"].forEach(id=>{$(id).disabled=true;$(id).title=T.st.noDl})}
async function offer(filename,data,okMsg){await dlReady;if(!dl){status(T.st.noDl,"err");return}
  status(okMsg);try{await dl.save({filename,data});status(T.st.saved,"ok")}
  catch(e){const code=e&&e.code;status(code==="declined"?T.st.declined:code==="unavailable"||code==="not_granted"?T.st.noDl:T.st.fail,code==="declined"?"":"err")}}
const fname=ext=>`${(model.settings.company||"DeXM").replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-|-$/g,"")||"DeXM"}-PL.${ext}`;

async function buildXlsx(blank){status(T.st.loading);await lib("xlsx");
  const m=blank?blankModel():model;const {rows,f}=exportPlan(m,blank);
  const ws=XLSX.utils.aoa_to_sheet(rows);
  f.forEach(([r,list])=>list.forEach(([ci,fx,kind])=>{const addr=XLSX.utils.encode_cell({r:r-1,c:ci+2});ws[addr]={t:"n",f:fx.replace(/\{r\}/g,r),z:kind==="pct"?"0.0%":"#,##0;(#,##0)"}}));
  ws["!cols"]=[{wch:16},{wch:42},...Array(W).fill({wch:12}),{wch:14}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"P&L");
  return XLSX.write(wb,{bookType:"xlsx",type:"array"})}
$("btnTemplate").onclick=async()=>{try{const b=await buildXlsx(true);await offer(LANG==="ru"?"DeXM-шаблон-PL.xlsx":"DeXM-PL-template.xlsx",new Uint8Array(b),T.st.tpl)}catch(e){console.error(e);status(T.st.fail,"err")}};
$("btnXlsx").onclick=async()=>{try{const b=await buildXlsx(false);await offer(fname("xlsx"),new Uint8Array(b),T.st.xlsx)}catch(e){console.error(e);status(T.st.fail,"err")}};

$("importFile").addEventListener("change",async e=>{const file=e.target.files[0];e.target.value="";if(!file)return;
  try{status(T.st.loading);await lib("xlsx");const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
    let best=null;for(const name of wb.SheetNames){const r=importAOA(XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null}));if(!r.error){best=r;break}}
    if(!best){status(T.st.noHeader,"err");return}
    model=best.model;isSample=false;$("sample").hidden=true;save();renderSettings();renderGrid();
    const setNames=best.settings.map(k=>({benchGM:T.benchGM,benchE:T.benchE,start:T.start,company:T.company,units:T.units}[k])).join(", ");
    status(T.st.imported(best.n,best.added,setNames)+(best.unrec.length?T.st.unrec(best.unrec.slice(0,6).join("; ")):""),best.unrec.length?"":"ok")}
  catch(err){console.error(err);status(T.st.readFail,"err")}});
$("btnReset").onclick=()=>{model=blankModel();isSample=false;$("sample").hidden=true;save();renderSettings();renderGrid();status(T.st.cleared,"ok")};

function reportPages(){
  const c=compute(model),s=model.settings,v=verdictData(c),PW=1500,PH=1060,SC=2,M=50,CW=PW-2*M;
  const F={sans:'"IBM Plex Sans","Segoe UI",Arial,sans-serif',mono:'"IBM Plex Mono",Menlo,monospace',disp:'"Archivo","Helvetica Neue",Arial,sans-serif'};
  const P={fg:"#1b2224",muted:"#5d686b",line:"#d6dbd9",band:"#eef1ef",acc:"#0e6b6b",accSoft:"#dcecea",bad:"#b4442d",good:"#2f7d4f",warn:"#b7791f"};
  const pages=[];
  const newPage=()=>{const cv=document.createElement("canvas");cv.width=PW*SC;cv.height=PH*SC;const g=cv.getContext("2d");g.scale(SC,SC);g.fillStyle="#fff";g.fillRect(0,0,PW,PH);pages.push(cv);return g};
  const foot=(g,n)=>{g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.textAlign="left";g.fillText("DeXM Management · info@dexm-m.com · +1 917 523 0461 · dexm-m.com",M,PH-28);g.textAlign="right";g.fillText(String(n),PW-M,PH-28);g.textAlign="left"};
  const wrap=(g,text,x,y,maxW,lh)=>{const words=String(text).replace(/<[^>]+>/g,"").split(" ");let line="";for(const w of words){const t=line?line+" "+w:w;if(g.measureText(t).width>maxW&&line){g.fillText(line,x,y);y+=lh;line=w}else line=t}if(line){g.fillText(line,x,y);y+=lh}return y};
  const clip=(g,text,maxW)=>{text=String(text);if(g.measureText(text).width<=maxW)return text;while(text.length>1&&g.measureText(text+"…").width>maxW)text=text.slice(0,-1);return text+"…"};
  let g=newPage(),y=M+24;
  g.fillStyle=P.fg;g.font=`800 30px ${F.disp}`;g.fillText(T.sheetTitle,M,y);y+=28;
  g.font=`14px ${F.sans}`;g.fillStyle=P.muted;g.fillText([s.company,`${T.units}: ${s.units||""}`,`${monthLabel(s.start,0)} – ${monthLabel(s.start,W-1)}`,`${T.prepared}: ${new Date().toLocaleDateString(loc)}`].filter(Boolean).join("   ·   "),M,y);y+=14;
  g.fillStyle=P.fg;g.fillRect(M,y,CW,2);y+=22;
  const kw=(CW-5*12)/6;kpiData(c).forEach(([l,val,sub,bad],i)=>{const x=M+i*(kw+12);g.strokeStyle=P.line;g.lineWidth=1;g.strokeRect(x+.5,y+.5,kw,78);
    g.font=`500 11px ${F.mono}`;g.fillStyle=P.muted;g.fillText(clip(g,l.toUpperCase(),kw-20),x+10,y+20);
    g.font=`600 24px ${F.mono}`;g.fillStyle=bad?P.bad:P.fg;g.fillText(val,x+10,y+50);g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.fillText(clip(g,sub||"",kw-20),x+10,y+68)});
  y+=104;const vy=y;
  g.font=`700 19px ${F.disp}`;g.fillStyle=P.fg;y=wrap(g,v.h,M+18,y+18,CW-30,24);g.font=`14px ${F.sans}`;g.fillStyle=P.muted;y=wrap(g,v.p,M+18,y+2,CW-30,20);
  g.font=`13px ${F.sans}`;g.fillStyle=P.fg;v.notes.forEach(t=>{y=wrap(g,"•  "+t,M+18,y+2,CW-40,19)});
  if(v.levers.length){g.font=`600 13px ${F.sans}`;g.fillText(T.v.levers,M+18,y+8);y+=28;g.font=`13px ${F.sans}`;v.levers.forEach(t=>{y=wrap(g,"•  "+t,M+18,y,CW-40,19)})}
  g.fillStyle=[P.good,P.warn,P.bad][v.sev];g.fillRect(M,vy,5,y-vy);y+=20;
  const ch=Math.max(220,PH-y-70),cc=document.createElement("canvas");
  drawChart(cc,c,{fg:P.fg,muted:P.muted,line:P.line,good:P.good,bad:P.bad,warn:P.warn,accent:P.acc,surface:"#fff",mono:F.mono},CW,ch,SC);
  g.drawImage(cc,M,y,CW,ch);y+=ch+8;
  g.font=`12px ${F.sans}`;let lx=M;[[P.good,T.lg.bar,10],[P.acc,T.lg.line,3],[P.warn,T.lg.bench,2]].forEach(([col,txt,h])=>{g.fillStyle=col;g.fillRect(lx,y+4-h/2,14,h);g.fillStyle=P.muted;g.fillText(txt,lx+20,y+8);lx+=g.measureText(txt).width+48});
  foot(g,1);
  const rows=[];const r=(lab,arr,kind,tot,isPct,red)=>rows.push({lab,arr,kind,tot,isPct,red});
  SECS.forEach(sec=>{rows.push({lab:T.sec[sec],kind:"sec"});model.lines.filter(l=>l.sec===sec).forEach(l=>r(labelOf(l),l.vals.map(x=>+x||0),"",sum12(l.vals)));
    if(sec==="rev")r(T.r.rev,c.rev,"sub",c.tot.rev);
    if(sec==="cogs"){r(T.r.cogs,c.cogs,"sub",c.tot.cogs);r(T.r.gp,c.gp,"key",c.tot.gp);r(T.r.gm,c.gm,"pct",c.gmY,1)}
    if(sec==="opex"){r(T.r.opex,c.opex,"sub",c.tot.opex);r(T.r.ebitda,c.ebitda,"key",c.tot.ebitda);r(T.r.em,c.em,"pct",c.emY,1,x=>x!=null&&x<c.bE)}
    if(sec==="below"){r(T.r.ebit,c.ebit,"sub",c.tot.ebit);r(T.r.ebt,c.ebt,"sub",c.tot.ebt);r(T.r.ni,c.ni,"key",c.tot.ni);r(T.r.nm,c.nm,"pct",c.nmY,1)}});
  const LW=300,VW=(CW-LW)/(W+1),RH=22,HH=44,top=M+40,per=Math.floor((PH-top-HH-70)/RH);
  for(let start=0,pn=2;start<rows.length;start+=per,pn++){
    g=newPage();g.fillStyle=P.fg;g.font=`700 18px ${F.disp}`;g.fillText(T.sheetTitle+(s.company?` · ${s.company}`:""),M,M+14);
    g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.fillText(`${T.units}: ${s.units||""}`,M,M+32);
    let ty=top;g.font=`500 11px ${F.mono}`;g.fillStyle=P.muted;g.textAlign="left";g.fillText(T.line.toUpperCase(),M+6,ty+26);g.textAlign="right";
    for(let i=0;i<=W;i++){const x=M+LW+VW*(i+1)-6;if(i<W){const [mn,yr]=monthLabel(s.start,i).split(" ");g.fillText(mn,x,ty+18);g.fillText(yr||"",x,ty+34)}else{const sp=T.total.lastIndexOf(" ");g.fillText(T.total.slice(0,sp),x,ty+18);g.fillText(T.total.slice(sp+1),x,ty+34)}}
    g.fillStyle=P.fg;g.fillRect(M,ty+HH-1,CW,1.5);ty+=HH;
    rows.slice(start,start+per).forEach(row=>{
      if(row.kind==="sec"){g.fillStyle=P.band;g.fillRect(M,ty,CW,RH);g.fillStyle=P.fg;g.font=`600 12px ${F.sans}`;g.textAlign="left";g.fillText(row.lab.toUpperCase(),M+6,ty+15);ty+=RH;return}
      if(row.kind==="key"){g.fillStyle=P.accSoft;g.fillRect(M,ty,CW,RH)}
      const bold=row.kind==="sub"||row.kind==="key";g.fillStyle=row.kind==="pct"?P.muted:P.fg;g.textAlign="left";g.font=`${bold?"600 ":row.kind==="pct"?"italic ":""}12.5px ${F.sans}`;g.fillText(clip(g,row.lab,LW-12),M+6,ty+15);
      g.textAlign="right";g.font=`${bold?"600 ":""}12px ${F.mono}`;
      const show=x=>row.isPct?pct(x):fmt(x);
      row.arr.forEach((x,i)=>{const red=row.red?row.red(x):x!=null&&x<0;g.fillStyle=red?P.bad:(row.kind==="pct"?P.muted:P.fg);g.fillText(show(x),M+LW+VW*(i+1)-6,ty+15)});
      if(row.tot!=null){g.fillStyle=(row.red?row.red(row.tot):row.tot<0)?P.bad:P.fg;g.fillText(show(row.tot),M+LW+VW*(W+1)-6,ty+15)}
      g.fillStyle=P.line;g.fillRect(M,ty+RH-1,CW,1);ty+=RH});
    g.textAlign="left";foot(g,pn)}
  return pages}
$("btnPdf").onclick=async()=>{try{status(T.st.loading);await lib("jspdf");if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const pages=reportPages();const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
  const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
  pages.forEach((cv,i)=>{if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,pw,ph)});
  await offer(fname("pdf"),pdf.output("arraybuffer"),T.st.pdf)}catch(e){console.error(e);status(T.st.fail,"err")}};

texts();renderSettings();renderGrid();$("sample").hidden=!isSample;
})()}
