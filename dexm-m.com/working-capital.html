const CY_KEYS=["supLT","ltVar","orderInt","transit","prodCycle","vaf","custLT","fgBuf","custTerms","late","supTerms","prepay"];

 ["rm",/(raw material|сырь|материал)/i],["adv",/(advances? (paid|to supplier)|supplier (advance|prepay)|авансы выданн|авансы поставщ)/i],["dep",/(customer (deposit|prepay|advance)|deposits?|авансы получ|предоплат)/i],
 ["oca",/(other operating assets|vat|prepaid|прочие оборотн|ндс)/i],["acc",/(accrue|начисл|payroll|tax(es)? pay|зарплат|налог)/i],["ar",/(receivable|дебитор)/i],["ap",/(payable|кредитор)/i]];
const SET_RE=[["rev",/^(revenue|net revenue|выручка)/i],["cogs",/(cost of goods|cost of sales|cogs|себестоим)/i],["mat",/(materials consumed|потребление материал|материальные затраты)/i],["pur",/(purchases|закупк)/i]];

function importAOA(rows){
  const txt=c=>c==null?"":String(c).trim();const m=blankModel();const found=[];let n=0,cB=null,cT=null,sawMode=false;
  for(const row of rows){if(!row)continue;const cells=row.map(txt);
    const bi=cells.findIndex(t=>/^(balance|остаток|сумма)$/i.test(t)),ti=cells.findIndex(t=>/^(target days|целевые дни)$/i.test(t));if(bi>=0){cB=bi;cT=ti>=0?ti:null;continue}

    if(/^(total|итого|net working|calc|cash conversion)/i.test(label))continue;

    if(label.toLowerCase().includes(T.cy.daysFrom))continue;
    const ck=CY_KEYS.find(k=>T.cy[k].toLowerCase()===label.toLowerCase());if(ck){const v=firstNum();if(v!=null)m.cycle[ck]=v;continue}

function verdictData(c){

    g.font=`12px ${F.sans}`;g.fillStyle=P.muted;let tx=M;ty+=14;CY_KEYS.forEach((k,i)=>{const t=`${T.cy[k].replace(/, (days|%)|, ± days/,"")}: ${pf.format(+cy[k]||0)}${/%/.test(T.cy[k])?"%":""}`;const w=g.measureText(t).width+22;if(tx+w>M+CW){tx=M;ty+=17}g.fillText(t,tx,ty);tx+=w});ty+=12;
    const cc=[[T.cy.line,420,"l"],[T.cy.how,520,"l"],[T.cy.days,140,"r"],[T.cy.bal,160,"r"],[T.cy.chg,160,"r"]];const s2=CW/cc.reduce((a,x)=>a+x[1],0);cc.forEach(x=>x[1]*=s2);const save=cols.splice(0,cols.length,...cc);
    row(cc.map(x=>x[0]),"head");["rm","git","adv","wip","fg","ar","ap"].forEach(id=>{const r=sc.c.by[id];row([T.rows[id],T.cy.f[id],pf.format(sc.days[id]),fmt(r.tBal),Math.round(r.impact)?sgn(r.impact):"—"],"",[null,P.muted,null,null,r.impact<-0.5?P.bad:r.impact>0.5?P.good:null])});
    row([T.cy.nwc,`${T.cy.ccc.replace(" in this scenario","")}: ${dd(sc.ccc)}`,"",fmt(sc.nwc),sgn(sc.rel)],"key");cols.splice(0,cols.length,...save)}
  g.textAlign="left";foot(g,2);
  return pages}
$("btnPdf").onclick=async()=>{try{status(T.st.loading);await lib("jspdf");if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const pages=reportPages();const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
  const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
  pages.forEach((cv,i)=>{if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,pw,ph)});
  await offer(fname("pdf"),pdf.output("arraybuffer"),T.st.pdf)}catch(e){console.error(e);status(T.st.fail,"err")}};

texts();renderSettings();renderGrid();$("sample").hidden=!isSample;
