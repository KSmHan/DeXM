  Q("Поставки в срок и в полном объёме (OTIF)","On-time, in-full delivery (OTIF)",
    ["Ниже 80%","80–88%","88–95%","95–98%","Выше 98%"],["Below 80%","80–88%","88–95%","95–98%","Above 98%"]),
  Q("Насколько узкое место ограничивает выпуск завода","How much the bottleneck limits plant output",
    ["Более чем на 50%","На 40–50%","На 30–40%","На 15–30%","Менее чем на 15%"],["More than 50%","40–50%","30–40%","15–30%","Less than 15%"],
    "Сколько выпуска теряется из-за того, что узкое место не успевает.","How much output is lost because the bottleneck can't keep up."),
  Q("Качество (брак, рекламации) против отраслевого бенчмарка","Quality (scrap, complaints) vs. industry benchmark",
    ["Заметно хуже","Немного хуже","На уровне","Лучше","Среди лучших в отрасли"],["Clearly worse","Slightly worse","On par","Better","Among the best in the industry"]),
  Q("Внеплановые простои оборудования, % рабочего времени","Unplanned equipment downtime, % of operating time",
    ["Больше 15%","10–15%","5–10%","2–5%","Меньше 2%"],["Over 15%","10–15%","5–10%","2–5%","Under 2%"]),
  Q("Зависимость от единственного поставщика по критичному сырью","Single-source dependence for critical materials",
    ["По большинству позиций","По нескольким, без запаса","По нескольким, с запасом","По одной-двум, есть план Б","Нет"],
    ["Most items","Several, no safety stock","Several, with safety stock","One or two, with a backup plan","None"])],
  steps:{ru:["Найти узкое место и поднять его выход: без простоев, SMED, контроль качества до него.","Подчинить график остальных участков темпу узкого места, снять зависимость от единственных поставщиков.","Только потом добавлять смены, аутсорс и капзатраты с оценкой по марже всего завода."],
   en:["Find the bottleneck and raise its output: no idle time, SMED, quality checks before it.","Schedule every other operation to the bottleneck's pace and remove single-source risks.","Only then add shifts, outsourcing or capex, judged by plant-wide margin."]}}
];
const ORDER=["money","market","capacity","system","people"];
const TOTAL=AXES.reduce((s,a)=>s+a.q.length,0);
const SAMPLE={market:[4,3,4,2,3,3],money:[2,"u","u",2,3],system:[2,2,3,2],people:[2,3,2,2,2],capacity:[3,3,3,3,4]};
const KEY="dexm-diag-v6-"+LANG;
let ans={},isSample=true;
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.ans){ans=s.ans;isSample=false}}catch(e){}
if(isSample)ans=JSON.parse(JSON.stringify(SAMPLE));
function save(){try{localStorage.setItem(KEY,JSON.stringify({ans}))}catch(e){}}

const sc=x=>x==="u"?1:x;
const answers=k=>{const a=AXES.find(x=>x.k===k);return(ans[k]||[]).slice(0,a.q.length).filter(x=>x!=null&&x!=="")};
const unknownCount=()=>AXES.reduce((s,a)=>s+answers(a.k).filter(x=>x==="u").length,0);
const answeredCount=()=>AXES.reduce((s,a)=>s+answers(a.k).length,0);
function dataScore(){if(!answeredCount())return null;const n=unknownCount();return n===0?5:n<=2?4:n<=4?3:n<=7?2:1}
function avg(k){const v=answers(k).map(sc);if(k==="system"&&v.length){v.push(dataScore())}return v.length?v.reduce((x,y)=>x+y,0)/v.length:null}
const color=v=>v==null?"var(--line)":v>=4?"var(--good)":v>=3?"var(--warn)":"var(--bad)";
const status=v=>v==null?"—":T.st[v>=4?2:v>=3?1:0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderText(){
  document.title=document.title;
  document.getElementById("t-brand").textContent=T.brand;
  document.getElementById("t-h1").textContent=T.h1;
  document.getElementById("t-lede").textContent=T.lede.replace("__N__",TOTAL);
  document.getElementById("sample").textContent=T.sample;
  document.getElementById("reset").textContent=T.reset;
  document.getElementById("copy").textContent=T.copy;
  document.getElementById("radar").setAttribute("aria-label",T.radar);
}

function renderAxes(){
  const root=document.getElementById("axes");root.innerHTML="";
  AXES.forEach(ax=>{
    const sec=document.createElement("section");sec.className="axis";
    let h=`<div class="axis-head"><h3>${ax.n}<small>${ax.sub[LANG]}</small></h3><span class="chip" id="chip-${ax.k}"></span></div>`;
    ax.q.forEach((q,i)=>{
      const cur=ans[ax.k]&&ans[ax.k][i];
      h+=`<div class="q" role="radiogroup" aria-labelledby="ql-${ax.k}-${i}"><p id="ql-${ax.k}-${i}">${esc(q.t[LANG])}${q.h?`<br><span class="hint">${esc(q.h[LANG])}</span>`:""}</p><div class="opts">`;
      q.o[LANG].forEach((o,j)=>{const v=j+1,id=`${ax.k}-${i}-${v}`;
        h+=`<label class="opt"><input type="radio" id="${id}" name="${ax.k}-${i}" value="${v}" ${cur===v?"checked":""}><span>${esc(o)}</span></label>`});
      h+=`<label class="opt u"><input type="radio" id="${ax.k}-${i}-u" name="${ax.k}-${i}" value="u" ${cur==="u"?"checked":""}><span>${T.unknown}</span></label></div></div>`;
    });
    if(ax.computed)h+=`<div class="q computed"><p>${T.dataItem} <span class="val" id="dataval"></span><br><span class="hint" id="datahint"></span></p></div>`;
    sec.innerHTML=h;
    sec.addEventListener("change",e=>{
      const [k,i]=e.target.name.split("-");if(!ans[k])ans[k]=[];
      ans[k][+i]=e.target.value==="u"?"u":+e.target.value;isSample=false;save();update()});
    root.appendChild(sec)});
}

function radar(){
  const svg=document.getElementById("radar"),cx=170,cy=152,R=104,n=5;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  let h="";
  for(let l=1;l<=5;l++)h+=`<polygon points="${[...Array(n)].map((_,i)=>pt(i,R*l/5).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`;
  AXES.forEach((ax,i)=>{const[x,y]=pt(i,R);h+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const[lx,ly]=pt(i,R+22),v=avg(ax.k);
    h+=`<text x="${lx}" y="${ly}" text-anchor="middle" font-size="12" fill="var(--fg)">${ax.n}</text><text x="${lx}" y="${ly+14}" text-anchor="middle" font-size="11" fill="var(--muted)">${v==null?"—":v.toFixed(1)}</text>`});
  for(let l=1;l<=5;l++){const[x,y]=pt(0,R*l/5);h+=`<text x="${x+4}" y="${y+3}" font-size="9" fill="var(--muted)">${l}</text>`}
  h+=`<polygon points="${AXES.map((ax,i)=>pt(i,R*(avg(ax.k)||0)/5).join(",")).join(" ")}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2"/>`;
  AXES.forEach((ax,i)=>{const v=avg(ax.k);if(v!=null){const[x,y]=pt(i,R*v/5);h+=`<circle cx="${x}" cy="${y}" r="4" fill="${color(v)}" stroke="var(--surface)" stroke-width="1.5"/>`}});
  svg.innerHTML=h;
}

function analysis(){
  const scored=AXES.filter(a=>avg(a.k)!=null).sort((a,b)=>avg(a.k)-avg(b.k)||ORDER.indexOf(a.k)-ORDER.indexOf(b.k));
  if(!scored.length)return null;
  const main=scored[0],v=avg(main.k),second=scored[1]?avg(scored[1].k):null;
  const gap=second==null?0:second-v,f=answeredCount()/TOTAL,u=unknownCount();
  const conf=(f<0.8||u>=5||gap<0.2)?0:(f===1&&u<=1&&gap>=0.5)?2:1;
  let root=null;
  if(!["system","people"].includes(main.k)){
    const c=AXES.filter(a=>["system","people"].includes(a.k)&&avg(a.k)!=null).sort((a,b)=>avg(a.k)-avg(b.k))[0];
    if(c&&avg(c.k)-v<=0.5)root=c;
  }
  return{main,v,conf,root,u};
}

function update(){
  document.getElementById("sample").hidden=!isSample;
  AXES.forEach(ax=>{const v=avg(ax.k),c=document.getElementById("chip-"+ax.k),cnt=answers(ax.k).length,nq=ax.q.length;
    c.textContent=v==null?`0/${nq}`:`${v.toFixed(1)} · ${status(v)}`+(cnt<nq?` · ${cnt}/${nq}`:"");
    c.style.background=v==null?"var(--bg)":color(v);c.style.color=v==null?"var(--muted)":"var(--surface)"});
  const ds=dataScore();
  document.getElementById("dataval").textContent=ds==null?"—":ds+" / 5";
  document.getElementById("datahint").textContent=T.dataHint(unknownCount());
  document.getElementById("bars").innerHTML=AXES.map(ax=>{const v=avg(ax.k);
    return `<div class="bar"><span>${ax.n}</span><div class="track"><div class="fill" style="width:${(v||0)*20}%;background:${color(v)}"></div></div><span class="num">${v==null?"—":v.toFixed(1)}</span></div>`}).join("");
  radar();
  const r=analysis(),vd=document.getElementById("verdict"),a=answeredCount();
  if(!r){vd.innerHTML=`<span class="label">${T.primary}</span><h2>${T.noneH}</h2><p>${T.noneP}</p>`;return}
  const confColor=["var(--bad)","var(--warn)","var(--good)"][r.conf];
  vd.innerHTML=`<span class="label">${T.primary}${a<TOTAL?" · "+T.answered(a,TOTAL):""}</span>
   <h2>${r.main.n} — ${r.main.sub[LANG]} (${r.v.toFixed(1)})</h2>
   <p>${T.conf}: <span class="conf" style="background:${confColor}">${T.confL[r.conf]}</span></p>
   <p>${r.v>=4?T.noConstraint:T.startHere}</p>
   ${r.root?`<p>${T.root(r.root.n,avg(r.root.k).toFixed(1),r.main.n)}</p>`:""}
   ${r.u?`<p>${T.unk(r.u)}</p>`:""}
   <span class="label" style="display:block;margin-top:10px">${T.steps}</span>
   <ol>${r.main.steps[LANG].map(s=>`<li>${s}</li>`).join("")}</ol>
   <p class="cta" style="margin-top:14px">${T.cta}</p>`;
}

document.getElementById("reset").onclick=()=>{ans={};isSample=false;save();renderAxes();update();toast(T.cleared)};
function toast(m){const t=document.getElementById("toast");t.textContent=m;setTimeout(()=>t.textContent="",2500)}
document.getElementById("copy").onclick=()=>{
  const r=analysis();
  const txt=T.copyHead+"\n"+AXES.map(a=>{const v=avg(a.k);return `${a.n}: ${v==null?"—":v.toFixed(1)} (${status(v)})`}).join("\n")+
   (r?`\n\n${T.copyMain}: ${r.main.n}\n${T.conf}: ${T.confL[r.conf]}\n${T.steps}:\n- ${r.main.steps[LANG].join("\n- ")}`:"")+
   "\n\nDeXM Management · info@dexm-m.com";
  navigator.clipboard.writeText(txt).then(()=>toast(T.copied),()=>toast(T.copyFail))};

renderText();renderAxes();update();
</script>

<script src="js/site-header.js"></script>
</body></html>
