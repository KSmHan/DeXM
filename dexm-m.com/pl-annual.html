const T={brand:"DeXM Management · financial analysis",h1:"Annual Profit and Loss Statement (P&L)",

 r:{rev:"Net revenue",vc:"Total variable costs",cm:"Contribution margin",fix:"Total fixed costs",ebitda:"EBITDA",ebt:"Pre-tax income",tax:r=>`Income tax (${r} of pre-tax income)`,ni:"Net income",
  cmr:"Contribution margin ratio",be:"Break-even revenue (EBITDA = 0)",mos:"Margin of safety (revenue above break-even)",bept:"Break-even revenue (pre-tax income = 0)",dol:"Operating leverage (contribution margin / EBITDA)"},
 calc:"Calculated",
 k:{rev:"Net revenue, FY",cm:"Contribution margin",ebitda:"EBITDA, FY",be:"Break-even revenue",mos:"Margin of safety",up:"EBITDA upside to benchmark",vsB:b=>`benchmark ${b}`,ofRev:p=>`${p} of revenue`,margin:(m,b)=>`margin ${m} · benchmark ${b}`,noBe:"contribution margin ≤ 0"},
 lg:{rev:"Revenue",cost:"Total costs (variable + fixed)",fix:"Fixed costs",be:"Break-even point",act:"Actual revenue"},
 v:{label:"Verdict",sev:["on track","watch","critical"],
  ok:"EBITDA is at or above the benchmark",okP:(e,b)=>`EBITDA margin is ${e} against a ${b} benchmark. Next: hold the margin as revenue grows and turn profit into cash.`,
  warn:g=>`EBITDA is ${g} below the benchmark`,warnP:u=>`Reaching the benchmark would add about ${u} of EBITDA a year.`,
  crit:g=>`EBITDA is ${g} below the benchmark`,critP:u=>`The gap is significant. Reaching the benchmark would add about ${u} of EBITDA a year.`,
  loss:"The business is below break-even at the EBITDA level",lossP:u=>`Reaching the benchmark takes an improvement of about ${u} a year.`,
  cmLow:(g,b)=>`Contribution margin of ${g} is below the ${b} benchmark, so the main issue is pricing or variable cost per unit.`,

  levers:"Levers",
  Lcm:["Reprice customers and SKUs with below-average contribution margin.","Cut material cost through purchasing, usage standards and scrap.","Raise labor productivity and OEE at the bottleneck."],
  Lfix:["Resize fixed costs to current sales volume.","Drop loss-making SKUs and customers from the portfolio.","Tie management bonuses to EBITDA margin."],
  cta:"<strong>Want a P&L review?</strong> DeXM finds EBITDA upside line by line and builds the plan to capture it in 2 weeks. info@dexm-m.com"},
 st:{tpl:"Template ready to save",xlsx:"Excel file ready to save",pdf:"PDF ready to save",saved:"File saved",declined:"Save cancelled",
  noDl:"Downloads are not available in this view. Open the page from its link in a browser.",fail:"Could not create the file. Try again.",loading:"Loading module…",
  imported:(n,m,s,mo)=>`Imported ${n} line items${m?`, added ${m} new lines`:""}${s?`, settings: ${s}`:""}${mo?". Monthly columns were added up to annual totals":""}.`,unrec:l=>` Not recognized: ${l}.`,
  noData:"Could not find any amounts. Use one column of annual amounts next to the line items, or a 12-month P&L. Download the template to see the format.",cleared:"Table cleared",readFail:"Could not read the file. Check that it is .xlsx, .xls or .csv."},
 sheetTitle:"Annual Profit and Loss Statement",prepared:"Prepared",chartAria:"Break-even chart: revenue against total costs",
 lines:{sales:"Product sales",svc:"Services and other revenue",disc:"Discounts, rebates and returns",mat:"Raw materials",lab:"Direct labor",ener:"Plant energy",frt:"Freight and logistics",moh:"Other manufacturing overhead",sm:"Sales and marketing",ga:"General and administrative",rent:"Rent",oopex:"Other operating expenses",da:"Depreciation and amortization",int:"Interest expense",oth:"Other income / (expense)"}};
const SECS=["rev","var","fix","below"];
const BUILT=[["sales","rev"],["svc","rev"],["disc","rev"],["mat","var"],["lab","var"],["ener","var"],["frt","var"],["moh","fix"],["sm","fix"],["ga","fix"],["rent","fix"],["oopex","fix"],["da","below"],["int","below"],["oth","below"]];
// sign of a line in the P&L: +1 adds, -1 subtracts
const signOf=l=>l.id==="disc"?-1:l.id==="oth"?1:l.sec==="rev"?1:-1;
const SIGNED=id=>id==="oth";
const ALIAS=[
 ["disc",/(discount|rebate|return|allowance)/i],
 ["sm",/(marketing|selling|sales exp)/i],
 ["svc",/(service|other revenue|other sales)/i],
 ["da",/(depreciation|amortization|\bd&a\b)/i],
 ["int",/(interest)/i],
 ["oopex",/(other operating|other opex)/i],
 ["oth",/(other income|other expense|non-?operating)/i],
 ["rent",/(rent|lease)/i],
 ["mat",/(raw material|material|component)/i],
 ["lab",/(direct labor|labou?r|wage)/i],
 ["ener",/(energy|electric|power|utilit)/i],
 ["frt",/(freight|logistic|shipping|delivery)/i],
 ["moh",/(overhead|manufacturing)/i],
 ["ga",/(general|admin|g&a|office)/i],
 ["sales",/(sales|revenue)/i]];
const SEC_RE=[["var",/(variable|cost of|cogs)/i],["fix",/(fixed|operating exp|opex|sg&a)/i],["below",/(below|non-?operat|other income|financ)/i],["rev",/(revenue|sales)/i]];
const CALC_RE=/(^total|gross profit|gross margin|contribution|ebitda|\bebit\b|\bebt\b|pre-?tax|net income|margin|net revenue|operating income|break-?even|safety|leverage|benchmark)/i;
const TAX_RE=/(income tax|\btax\b|taxes)/i;
const SET_RE=[["taxRate",/(tax rate)/i],["benchCM",/(contribution margin bench)/i],["benchE",/(ebitda bench)/i],["year",/(fiscal year|^year$)/i],["company",/^company/i],["units",/^units/i]];
const ALL_LABELS={};Object.entries(T.lines).forEach(([k,v])=>ALL_LABELS[v.toLowerCase()]=k);
const MONTH_RE=[/^jan/i,/^feb/i,/^mar/i,/^apr/i,/^may/i,/^jun/i,/^jul/i,/^aug/i,/^sep/i,/^oct/i,/^nov/i,/^dec/i];
const PER_RE=/^(month|mon|m|p|period)\.?\s*(\d{1,2})\b/i;
const AMT_RE=/^((fy|fiscal year)\s*'?\d{2,4}|fy|fy total|total|total year|amount|annual|annual total|year|full year|\d{4})$/i;

const thisYear=()=>new Date().getFullYear();
function blankModel(){return{settings:{company:"",year:thisYear(),units:T.unitsDef,benchCM:30,benchE:12,taxRate:25},lines:BUILT.map(([id,sec])=>({id,sec,v:0}))}}
function sampleModel(){const m=blankModel();m.settings.company=T.companyDef;m.settings.benchCM=32;m.settings.benchE=14;
  const V={sales:30370,svc:720,disc:911,mat:15185,lab:4031,ener:1215,frt:911,moh:1320,sm:1063,ga:1800,rent:540,oopex:360,da:840,int:420,oth:-5};
  m.lines.forEach(l=>l.v=V[l.id]);return m}
const labelOf=l=>l.id?T.lines[l.id]:(l.label||T.newLine);

function compute(m){
  const sumSec=(sec,f)=>m.lines.filter(l=>l.sec===sec&&(!f||f(l))).reduce((a,l)=>a+signOf(l)*(+l.v||0),0);
  const val=id=>m.lines.filter(l=>l.id===id).reduce((a,l)=>a+(+l.v||0),0);
  const rev=sumSec("rev"),vc=-sumSec("var"),fix=-sumSec("fix");
  const cm=rev-vc,ebitda=cm-fix;
  const da=val("da"),fin=sumSec("below",l=>l.id!=="da");
  const ebt=ebitda-da+fin,taxRate=+m.settings.taxRate||0,tax=Math.max(0,ebt)*taxRate/100,ni=ebt-tax;
  const P=x=>rev?x/rev*100:null;
  const cmr=rev?cm/rev:null;
  const be=cmr>0?fix/cmr:null,mos=be!=null?rev-be:null,bept=cmr>0?(fix+da-fin)/cmr:null;
  const dol=ebitda>0?cm/ebitda:null;
  const bE=+m.settings.benchE||0,bC=+m.settings.benchCM||0;
  return{rev,vc,cm,fix,ebitda,da,fin,ebt,tax,taxRate,ni,cmY:P(cm),emY:P(ebitda),nmY:P(ni),cmr,be,mos,bept,dol,bE,bC,
    upside:Math.max(0,bE/100*rev-ebitda),matShare:rev?val("mat")/rev*100:null,P}
}

function parseNum(x){if(typeof x==="number")return isFinite(x)?x:null;if(x==null)return null;
  let s=String(x).trim().replace(/[\s $€£₽]/g,"");if(!s||s==="-"||s==="—")return null;
  let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(s.includes(",")&&s.includes("."))s=s.lastIndexOf(",")>s.lastIndexOf(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");
  else if(s.includes(","))s=/,\d{3}$/.test(s)&&!/,\d{3},?\d{1,2}$/.test(s)?s.replace(/,/g,""):s.replace(",",".");
  const n=parseFloat(s);return isFinite(n)?(neg?-n:n):null}

// month header cell -> {m,y} | {n} | null
function perCell(c){
  if(c instanceof Date&&!isNaN(c))return{m:c.getMonth(),y:c.getFullYear()};
  const t=String(c==null?"":c).trim();if(!t)return null;
  let mm=t.match(PER_RE);if(mm){const n=+mm[2];return n>=1&&n<=12?{n}:null}
  mm=t.match(/^(\d{4})-(\d{2})/);if(mm)return{m:+mm[2]-1,y:+mm[1]};
  for(let i=0;i<12;i++)if(MONTH_RE[i].test(t)){const y=t.match(/(\d{4})/);return{m:i,y:y?+y[1]:null}}
  return null}

// Reads an annual sheet (one amount column) or a 12-month P&L (months are added up)
function importAOA(rows){
  const txt=c=>c==null?"":String(c).trim();
  let hdr=-1,cols=null,monthly=false,year=null;
  for(let r=0;r<Math.min(rows.length,60)&&hdr<0;r++){const row=rows[r]||[];
    const hits=[];row.forEach((c,ci)=>{const p=perCell(c);if(p)hits.push([ci,p])});
    if(hits.length>=6){hdr=r;monthly=true;cols=hits.slice(0,12).map(h=>h[0]);const f=hits.find(h=>h[1].y);if(f)year=f[1].y;break}
    row.forEach((c,ci)=>{if(hdr>=0||typeof c!=="string")return;const t=c.trim();if(AMT_RE.test(t)&&!/%/.test(t)){hdr=r;cols=[ci];const y=t.match(/(\d{4})/);if(y)year=+y[1]}})}
  const model=blankModel();model.settings.units="";const found=[];
  if(year){model.settings.year=year;found.push("year")}
  let curSec=null,n=0,added=0;const unrec=[],hit=new Set();
  const secOf=t=>{for(const [k,re] of SEC_RE)if(re.test(t))return k;return null};
  const amountOf=(row,lastLabelCol)=>{if(cols)return cols.reduce((a,ci)=>{const v=parseNum(row[ci]);return v==null?a:(a??0)+v},null);
    for(let ci=lastLabelCol+1;ci<row.length;ci++){const v=parseNum(row[ci]);if(v!=null)return v}return null};
  for(let r=0;r<rows.length;r++){if(r===hdr)continue;const row=rows[r]||[];
    const firstNum=cols?Math.min(...cols):row.findIndex(c=>typeof c==="number"||(parseNum(c)!=null&&!/[a-z]/i.test(txt(c))));
    const left=row.slice(0,firstNum<0?row.length:firstNum).map(txt);const nonEmpty=left.filter(Boolean);if(!nonEmpty.length)continue;
    let li=left.length-1;while(li>=0&&!left[li])li--;const label=left[li];const secText=nonEmpty.length>1?nonEmpty[0]:"";
    // settings rows (company, units, fiscal year, benchmarks)
    const setK=SET_RE.find(([k,re])=>re.test(label));
    if(setK&&!found.includes(setK[0])&&(hdr<0||r<hdr)){const k=setK[0];const rest=row.slice(row.indexOf(row.find(c=>txt(c)===label))+1).filter(x=>txt(x)!=="");
      if(rest.length){let v=rest[0];if(k==="company"||k==="units")v=txt(v);else{v=parseNum(v);if(v!=null&&k!=="year"&&Math.abs(v)<=1&&v!==0)v*=100}
        if(v!=null&&v!==""){model.settings[k]=v;found.push(k)}}continue}
    if(hdr>=0&&r<hdr)continue;
    if(left.some(t=>/^calc/i.test(t)))continue;
    const amt=amountOf(row,li);
    if(amt==null){const s=secOf(label);if(s)curSec=s;continue}
    if(CALC_RE.test(label)&&!ALL_LABELS[label.toLowerCase()])continue;
    if(TAX_RE.test(label)&&!ALL_LABELS[label.toLowerCase()])continue;
    const sec=(secText&&secOf(secText))||curSec;
    let id=ALL_LABELS[label.toLowerCase()];
    if(!id&&/(cost of|cogs)/i.test(label)){model.lines.push({id:null,sec:"var",label,v:Math.abs(amt)});added++;continue}
    if(!id)for(const [k,re] of ALIAS)if(re.test(label)){id=k;break}
    if(id){const line=model.lines.find(l=>l.id===id);line.v+=SIGNED(id)?amt:Math.abs(amt);if(!hit.has(id)){hit.add(id);n++}}
    else if(sec){model.lines.push({id:null,sec,label,v:Math.abs(amt)});added++}
    else if(amt)unrec.push(label)}
  if(!n&&!added)return{error:"noData"};
  if(!model.settings.units)model.settings.units=T.unitsDef;
  model.lines.sort((a,b)=>SECS.indexOf(a.sec)-SECS.indexOf(b.sec));
  return{model,n,added,unrec,settings:found,monthly}
}

// Excel export: rows + formulas. Columns: A section, B line item, C FY amount, D % of revenue
function exportPlan(m,blank){
  const rows=[],F=[];const s=m.settings;
  const push=(r,fs)=>{rows.push(r);if(fs)F.push([rows.length,fs]);return rows.length};
  push([T.sheetTitle]);push([T.company,"",blank?"":s.company]);push([T.units,"",s.units]);push([T.year,"",+s.year||thisYear()]);
  push([T.benchCM,"",+s.benchCM||0]);push([T.benchE,"",+s.benchE||0]);const rateRow=push([T.taxRate,"",+s.taxRate||0]);push([]);
  push([T.section,T.line,T.fy(s.year||thisYear()),T.pcol]);
  const PCT=r=>[3,`IF(AND(ISNUMBER(C${r}),C{REV}<>0),C${r}/C{REV},"")`,"pct"];
  const calc=(label,fx,opt={})=>{const r=rows.length+1;const fs=[];if(fx)fs.push([2,fx,opt.kind||"num"]);if(opt.pct)fs.push([3,opt.pct,"pct"]);else if(!opt.noPct)fs.push(PCT(r));push([T.calc,label,null,null],fs);return r};
  const L={rev:[],var:[],fix:[],below:[]},R={};
  const sum=(list,signed)=>list.length?list.map(([r,sg],j)=>`${signed&&sg<0?"-":(j?"+":"")}C${r}`).join(""):"0";
  SECS.forEach(sec=>{push([T.sec[sec]]);
    m.lines.filter(l=>l.sec===sec).forEach(l=>{const r=rows.length+1;push([T.sec[sec],labelOf(l),blank?0:(+l.v||0),null],[PCT(r)]);L[sec].push([r,signOf(l),l.id])});
    if(sec==="rev")R.rev=calc(T.r.rev,sum(L.rev,true));
    if(sec==="var"){R.vc=calc(T.r.vc,sum(L.var));R.cm=calc(T.r.cm,`C${R.rev}-C${R.vc}`)}
    if(sec==="fix"){R.fix=calc(T.r.fix,sum(L.fix));R.ebitda=calc(T.r.ebitda,`C${R.cm}-C${R.fix}`)}
    if(sec==="below"){const das=L.below.filter(x=>x[2]==="da"),fin=L.below.filter(x=>x[2]!=="da");
      R.da=das;R.finList=fin;
      R.ebt=calc(T.r.ebt,`C${R.ebitda}`+das.map(([r])=>`-C${r}`).join("")+fin.map(([r,sg])=>`${sg<0?"-":"+"}C${r}`).join(""));
      R.tax=calc(T.r.tax(`${+s.taxRate||0}%`),`MAX(0,C${R.ebt})*C${rateRow}/100`);
      R.ni=calc(T.r.ni,`C${R.ebt}-C${R.tax}`)}});
  push([T.sec.be]);
  calc(T.r.cmr,null,{pct:`IF(C{REV}=0,"",C${R.cm}/C{REV})`});
  const be=calc(T.r.be,`IF(C${R.cm}<=0,"n/a",C${R.fix}/(C${R.cm}/C{REV}))`);
  calc(T.r.mos,`IF(ISNUMBER(C${be}),C{REV}-C${be},"n/a")`);
  const fixedPt=`C${R.fix}`+R.da.map(([r])=>`+C${r}`).join("")+R.finList.map(([r,sg])=>`${sg<0?"+":"-"}C${r}`).join("");
  calc(T.r.bept,`IF(C${R.cm}<=0,"n/a",(${fixedPt})/(C${R.cm}/C{REV}))`);
  calc(T.r.dol,`IF(C${R.ebitda}<=0,"n/a",C${R.cm}/C${R.ebitda})`,{kind:"x",noPct:true});
  F.forEach(([,fs])=>fs.forEach(x=>x[1]=x[1].replace(/\{REV\}/g,R.rev)));
  return{rows,f:F};
}

<script>
if(typeof document!=="undefined"){(function(){
const KEY="dexm-pl-annual-v1";
let model,isSample=false;
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.lines){s.lines=s.lines.filter(l=>l.id!=="tax");if(s.settings.taxRate==null)s.settings.taxRate=25;model=s}}catch(e){}
if(!model){model=sampleModel();isSample=true}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(model))}catch(e){}};
const loc="en-US";
const nf=new Intl.NumberFormat(loc,{maximumFractionDigits:0}),pf=new Intl.NumberFormat(loc,{minimumFractionDigits:1,maximumFractionDigits:1});
const fmt=v=>{if(v==null||!isFinite(v))return "—";v=Math.round(v);if(!v)return "0";return v<0?`(${nf.format(-v)})`:nf.format(v)};
const pct=v=>v==null||!isFinite(v)?"—":`${pf.format(Math.abs(v)<.05?0:v)}%`;
const pp=v=>`${pf.format(v)} pts`;
const xf=v=>v==null||!isFinite(v)?"—":`${pf.format(v)}x`;
const fmtU=v=>`${fmt(v)} ${model.settings.units||""}`.trim();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function status(msg,cls){const s=$("status");s.textContent=msg||"";s.className="status"+(cls?" "+cls:"")}

function texts(){$("t-brand").textContent=T.brand;$("t-h1").textContent=T.h1;
  $("t-import").textContent=T.imp;$("btnTemplate").textContent=T.tpl;$("btnXlsx").textContent=T.xlsx;$("btnPdf").textContent=T.pdf;$("btnReset").textContent=T.reset;
  $("sample").textContent=T.sample;$("chart").setAttribute("aria-label",T.chartAria);
  $("legend").innerHTML=`<span><i style="background:var(--accent);height:3px"></i>${T.lg.rev}</span><span><i style="background:var(--bad);height:3px"></i>${T.lg.cost}</span><span><i style="background:var(--warn);height:2px"></i>${T.lg.fix}</span><span><i style="background:var(--fg);width:10px;border-radius:50%"></i>${T.lg.be}</span><span><i style="background:var(--muted);width:2px"></i>${T.lg.act}</span>`}

function renderSettings(){const s=model.settings;
  const f=(k,lab,type,cls)=>`<div class="field"><label class="label" for="set-${k}">${lab}</label><input id="set-${k}" data-k="${k}" type="${type}" ${cls?`class="${cls}" inputmode="decimal" step="any"`:""} value="${esc(s[k]??"")}"></div>`;
  $("settings").innerHTML=f("company",T.company,"text")+f("year",T.year,"number","num")+f("units",T.units,"text")+f("benchCM",T.benchCM,"number","num")+f("benchE",T.benchE,"number","num")+f("taxRate",T.taxRate,"number","num")}
$("settings").addEventListener("input",e=>{const k=e.target.dataset.k;if(!k)return;
  model.settings[k]=["benchCM","benchE","year","taxRate"].includes(k)?(parseFloat(e.target.value)||0):e.target.value;touch();
  if(k==="year"||k==="units"||k==="taxRate")renderGrid();else update()});

function renderGrid(){
  const s=model.settings;let h=`<thead><tr><th class="lab">${T.line}</th><th>${T.fy(s.year||thisYear())}<small>${esc(s.units||"")}</small></th><th>${T.pcol}</th></tr></thead><tbody>`;
  const calcRow=(key,cls)=>`<tr class="${cls||"sub"}"><td class="lab">${key==="tax"?T.r.tax(`${s.taxRate||0}%`):T.r[key]}</td><td class="c" id="c-${key}"></td><td class="c p" id="p-${key}"></td></tr>`;
  SECS.forEach(sec=>{h+=`<tr class="sec"><td class="lab">${T.sec[sec]}</td><td colspan="2"></td></tr>`;
    model.lines.forEach((l,li)=>{if(l.sec!==sec)return;
      const mv=sec==="var"?`<button class="mv" data-mv="${li}" title="${T.toFixT}">${T.toFix}</button>`:sec==="fix"?`<button class="mv" data-mv="${li}" title="${T.toVarT}">${T.toVar}</button>`:"";
      h+=`<tr><td class="lab"><div class="row">${l.id?`<span>${esc(labelOf(l))}</span>`:`<input id="lab-${li}" data-li="${li}" class="labin" value="${esc(l.label||"")}" placeholder="${T.newLine}">`}${mv}${l.id?"":`<button class="del" data-del="${li}" aria-label="${T.del}">×</button>`}</div></td>`;
      h+=`<td class="v"><input type="number" step="any" inputmode="decimal" id="in-${li}" data-li="${li}" data-amt="1" value="${l.v===0?"":l.v}" placeholder="0" aria-label="${esc(labelOf(l))}, ${T.fy(s.year)}"></td><td class="c p" id="lp-${li}"></td></tr>`});
    h+=`<tr class="add"><td class="lab"><button data-add="${sec}">${T.add}</button></td><td colspan="2"></td></tr>`;
    if(sec==="rev")h+=calcRow("rev");
    if(sec==="var")h+=calcRow("vc")+calcRow("cm","key");
    if(sec==="fix")h+=calcRow("fix")+calcRow("ebitda","key");
    if(sec==="below")h+=calcRow("ebt")+calcRow("tax","be")+calcRow("ni","key")});
  h+=`<tr class="sec"><td class="lab">${T.sec.be}</td><td colspan="2"></td></tr>`+["cmr","be","mos","bept","dol"].map(k=>calcRow(k,k==="be"?"key":"be")).join("");
  $("grid").innerHTML=h+"</tbody>";update()}

$("grid").addEventListener("input",e=>{const t=e.target;
  if(t.dataset.amt){model.lines[+t.dataset.li].v=parseFloat(t.value)||0;touch();update()}
  else if(t.classList.contains("labin")){model.lines[+t.dataset.li].label=t.value;touch()}});
$("grid").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.add,d=b.dataset.del,mv=b.dataset.mv;
  if(a){const idx=model.lines.map(l=>l.sec).lastIndexOf(a);model.lines.splice(idx+1,0,{id:null,sec:a,label:"",v:0});touch();renderGrid();const inp=$(`lab-${idx+1}`);inp&&inp.focus()}
  if(d!=null){model.lines.splice(+d,1);touch();renderGrid()}
  if(mv!=null){const [l]=model.lines.splice(+mv,1);l.sec=l.sec==="var"?"fix":"var";const idx=model.lines.map(x=>x.sec).lastIndexOf(l.sec);model.lines.splice(idx+1,0,l);touch();renderGrid()}});
$("grid").addEventListener("paste",e=>{const t=e.target;if(!t.dataset.amt)return;const txt=e.clipboardData?e.clipboardData.getData("text"):"";
  if(!/\n/.test(txt.trim()))return;e.preventDefault();const li0=+t.dataset.li;
  txt.replace(/\r/g,"").split("\n").filter(r=>r!=="").forEach((r,ri)=>{const l=model.lines[li0+ri];if(!l)return;const cells=r.split("\t");const v=parseNum(cells[cells.length-1]);l.v=v==null?0:(SIGNED(l.id)?v:Math.abs(v))});
  touch();renderGrid()});
function touch(){if(isSample){isSample=false;$("sample").hidden=true}save()}

function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(Math.max(r,1e-9))));const n=r/p;return(n<1.5?1:n<3?2:n<7?5:10)*p}
// Break-even (cost-volume-profit) chart: revenue line vs total cost line, fixed costs, break-even point and actual revenue
function drawChart(cv,c,pal,wpx,hpx,scale){
  const dpr=scale||window.devicePixelRatio||1;const w=wpx||cv.clientWidth||600,hgt=hpx||cv.clientHeight||260;
  cv.width=w*dpr;cv.height=hgt*dpr;const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,hgt);
  const padL=64,padR=18,padT=14,padB=30,H=hgt-padT-padB,Wd=w-padL-padR;
  const rev=Math.max(c.rev,0),vcr=c.rev>0?c.vc/c.rev:0,cost=x=>c.fix+vcr*x;
  let xMax=Math.max(rev,c.be||0)*1.3;if(!(xMax>0))xMax=Math.max(c.fix*2,1);
  let yMax=Math.max(xMax,cost(xMax),c.fix,1)*1.05;
  const X=v=>padL+v/xMax*Wd,Y=v=>padT+(1-v/yMax)*H;
  g.font=`11px ${pal.mono}`;g.lineWidth=1;g.textBaseline="middle";
  const ys=niceStep(yMax/4);g.textAlign="right";for(let t=0;t<=yMax+1e-9;t+=ys){g.strokeStyle=pal.line;g.beginPath();g.moveTo(padL,Y(t)+.5);g.lineTo(w-padR,Y(t)+.5);g.stroke();g.fillStyle=pal.muted;g.fillText(fmt(t),padL-6,Y(t))}
  const xs=niceStep(xMax/(Wd>420?5:3));g.textAlign="center";g.textBaseline="top";for(let t=0;t<=xMax+1e-9;t+=xs){g.fillStyle=pal.muted;g.fillText(fmt(t),X(t),hgt-padB+8)}
  // loss / profit areas between the two lines
  const area=(a,b,col)=>{if(!(b>a))return;g.fillStyle=col;g.globalAlpha=.13;g.beginPath();g.moveTo(X(a),Y(a));g.lineTo(X(b),Y(b));g.lineTo(X(b),Y(cost(b)));g.lineTo(X(a),Y(cost(a)));g.closePath();g.fill();g.globalAlpha=1};
  const be=c.be!=null&&c.be<xMax?c.be:null;
  if(c.cmr>0){area(0,be??xMax,pal.bad);if(be!=null)area(be,xMax,pal.good)}else area(0,xMax,pal.bad);
  g.strokeStyle=pal.warn;g.setLineDash([5,4]);g.lineWidth=1.5;g.beginPath();g.moveTo(X(0),Y(c.fix));g.lineTo(X(xMax),Y(c.fix));g.stroke();g.setLineDash([]);
  g.strokeStyle=pal.bad;g.lineWidth=2.5;g.beginPath();g.moveTo(X(0),Y(cost(0)));g.lineTo(X(xMax),Y(Math.min(cost(xMax),yMax)));g.stroke();
  g.strokeStyle=pal.accent;g.lineWidth=2.5;g.beginPath();g.moveTo(X(0),Y(0));g.lineTo(X(xMax),Y(xMax));g.stroke();
  if(rev>0){g.strokeStyle=pal.muted;g.lineWidth=1;g.setLineDash([2,3]);g.beginPath();g.moveTo(X(rev),padT);g.lineTo(X(rev),padT+H);g.stroke();g.setLineDash([]);
    g.font=`11px ${pal.mono}`;g.fillStyle=pal.muted;g.textBaseline="top";g.textAlign=X(rev)>w-120?"right":"left";g.fillText(`${T.lg.act} ${fmt(rev)}`,X(rev)+(g.textAlign==="right"?-5:5),padT+2)}
  if(be!=null){g.beginPath();g.arc(X(be),Y(be),5,0,7);g.fillStyle=pal.fg;g.fill();g.strokeStyle=pal.surface;g.lineWidth=2;g.stroke();
    g.font=`600 11px ${pal.mono}`;g.fillStyle=pal.fg;g.textBaseline="bottom";g.textAlign="right";g.fillText(`BE ${fmt(be)}`,X(be)-8,Y(be)-6)}}
const pagePal=()=>({fg:css("--fg"),muted:css("--muted"),line:css("--line"),good:css("--good"),bad:css("--bad"),warn:css("--warn"),accent:css("--accent"),surface:css("--surface"),mono:css("--mono")});

function verdictData(c){const gap=(c.emY||0)-c.bE,notes=[];
  if(c.cmY!=null)notes.push(c.cmY<c.bC?T.v.cmLow(pct(c.cmY),pct(c.bC)):T.v.cmOk(pct(c.cmY),pct(c.bC)));
  if(c.rev&&!(c.cmr>0))notes.push(T.v.noCm);
  else if(c.mos!=null)notes.push(c.mos>=0?T.v.mosOk(pct(c.P(c.mos)),fmtU(c.mos)):T.v.mosNeg(fmtU(-c.mos)));
  if(c.dol!=null)notes.push(T.v.dol(xf(c.dol),pct(c.dol*10)));
  if(c.matShare)notes.push(T.v.matShare(pct(c.matShare)));
  const levers=c.cmY!=null&&c.cmY<c.bC?T.v.Lcm:T.v.Lfix;
  if(!c.rev&&c.ebitda>=0)return{sev:0,h:"—",p:"",notes:[],levers:[]};
  if(c.ebitda<0)return{sev:2,h:T.v.loss,p:T.v.lossP(fmtU(c.upside)),notes,levers};
  if(gap>=0)return{sev:0,h:T.v.ok,p:T.v.okP(pct(c.emY),pct(c.bE)),notes,levers:[]};
  if(gap>-5)return{sev:1,h:T.v.warn(pp(-gap)),p:T.v.warnP(fmtU(c.upside)),notes,levers};
  return{sev:2,h:T.v.crit(pp(-gap)),p:T.v.critP(fmtU(c.upside)),notes,levers}}
function kpiData(c){const u=model.settings.units;return[
  [T.k.rev,fmt(c.rev),u,false],
  [T.k.cm,pct(c.cmY),T.k.vsB(pct(c.bC)),c.cmY!=null&&c.cmY<c.bC],
  [T.k.ebitda,fmt(c.ebitda),T.k.margin(pct(c.emY),pct(c.bE)),c.ebitda<0||(c.emY!=null&&c.emY<c.bE)],
  [T.k.be,fmt(c.be),c.be!=null?T.k.ofRev(pct(c.P(c.be))):(c.rev?T.k.noBe:u),c.be==null&&!!c.rev||c.be>c.rev],
  [T.k.mos,fmt(c.mos),c.mos!=null?T.k.ofRev(pct(c.P(c.mos))):u,c.mos!=null&&c.mos<0],
  [T.k.up,fmt(c.upside),u,c.upside>0]]}

function update(){const c=compute(model);
  const set=(id,v,kind,bad)=>{const el=$(id);if(!el)return;el.textContent=kind==="pct"?pct(v):kind==="x"?xf(v):v==null?"":fmt(v);el.classList.toggle("neg",v!=null&&v<0);if(bad!=null)el.classList.toggle("below",!!bad)};
  ["rev","vc","cm","fix","ebitda","ebt","tax","ni"].forEach(k=>{set(`c-${k}`,c[k]);set(`p-${k}`,c.P(c[k]),"pct")});
  $("p-cm").classList.toggle("below",c.cmY!=null&&c.cmY<c.bC);$("p-ebitda").classList.toggle("below",c.emY!=null&&c.emY<c.bE);
  set("c-cmr",null);set("p-cmr",c.cmY,"pct");
  ["be","mos","bept"].forEach(k=>{const el=$(`c-${k}`);el.textContent=fmt(c[k]);el.classList.toggle("neg",c[k]!=null&&c[k]<0);set(`p-${k}`,c[k]==null?null:c.P(c[k]),"pct")});
  $("c-be").classList.toggle("below",c.be==null&&!!c.rev||c.be>c.rev);
  set("c-dol",c.dol,"x");set("p-dol",null);
  model.lines.forEach((l,li)=>set(`lp-${li}`,c.P(+l.v||0),"pct"));
  $("kpis").innerHTML=kpiData(c).map(([l,v,s,bad])=>`<div class="kpi${bad?" bad":""}"><span class="label">${l}</span><b>${v}</b><small>${esc(s||"")}</small></div>`).join("");
  drawChart($("chart"),c,pagePal());
  const v=verdictData(c);const sevC=["var(--good)","var(--warn)","var(--bad)"][v.sev];
  $("verdict").innerHTML=`<span class="label">${T.v.label}</span> <span class="sev" style="background:${sevC}">${T.v.sev[v.sev]}</span><h2>${v.h}</h2><p>${v.p}</p>${v.notes.length?`<ul>${v.notes.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}${v.levers.length?`<span class="label">${T.v.levers}</span><ul>${v.levers.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}<p class="cta">${T.v.cta}</p>`}

const LIBS={xlsx:"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",jspdf:"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"};
const loaded={};function lib(k){return loaded[k]||(loaded[k]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=LIBS[k];s.onload=res;s.onerror=()=>{loaded[k]=null;rej(new Error("load"))};document.head.appendChild(s)}))}
const browserDl={save:async({filename,data})=>{const url=URL.createObjectURL(new Blob([data]));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return{status:"saved"}}};

async function buildXlsx(blank){status(T.st.loading);await lib("xlsx");
  const m=blank?blankModel():model;const {rows,f}=exportPlan(m,blank);
  const ws=XLSX.utils.aoa_to_sheet(rows);const Z={num:"#,##0;(#,##0)",pct:"0.0%",x:'0.0"x"'};
  f.forEach(([r,list])=>list.forEach(([ci,fx,kind])=>{ws[XLSX.utils.encode_cell({r:r-1,c:ci})]={t:"n",f:fx,z:Z[kind]}}));
  rows.forEach((row,ri)=>{const cell=ws[XLSX.utils.encode_cell({r:ri,c:2})];if(cell&&cell.t==="n"&&!cell.f&&ri>8)cell.z=Z.num});
  ws["!cols"]=[{wch:16},{wch:48},{wch:14},{wch:14}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Annual P&L");
  return XLSX.write(wb,{bookType:"xlsx",type:"array"})}

function reportPages(){
  const c=compute(model),s=model.settings,v=verdictData(c),PW=1500,PH=1060,SC=2,M=50,CW=PW-2*M;
  const F={sans:'"Inter","Segoe UI",Arial,sans-serif',mono:'"IBM Plex Mono",Menlo,monospace',disp:'"Source Serif 4",Georgia,serif'};
  const P={fg:"#0f1a2b",muted:"#5a6476",line:"#dcdad2",band:"#f3f1eb",acc:"#1d3a63",accSoft:"#f8f1e2",bad:"#b23f2a",good:"#2e7a4e",warn:"#b07418"};
  const pages=[];
  const newPage=()=>{const cv=document.createElement("canvas");cv.width=PW*SC;cv.height=PH*SC;const g=cv.getContext("2d");g.scale(SC,SC);g.fillStyle="#fff";g.fillRect(0,0,PW,PH);pages.push(cv);return g};
  const foot=(g,n)=>{g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.textAlign="left";g.fillText("DeXM Management · info@dexm-m.com · +1 917 523 0461 · dexm-m.com",M,PH-28);g.textAlign="right";g.fillText(String(n),PW-M,PH-28);g.textAlign="left"};
  const wrap=(g,text,x,y,maxW,lh)=>{const words=String(text).replace(/<[^>]+>/g,"").split(" ");let line="";for(const w of words){const t=line?line+" "+w:w;if(g.measureText(t).width>maxW&&line){g.fillText(line,x,y);y+=lh;line=w}else line=t}if(line){g.fillText(line,x,y);y+=lh}return y};
  const clip=(g,text,maxW)=>{text=String(text);if(g.measureText(text).width<=maxW)return text;while(text.length>1&&g.measureText(text+"…").width>maxW)text=text.slice(0,-1);return text+"…"};
  let g=newPage(),y=M+24;
  g.fillStyle=P.fg;g.font=`800 30px ${F.disp}`;g.fillText(T.sheetTitle,M,y);y+=28;
  g.font=`14px ${F.sans}`;g.fillStyle=P.muted;g.fillText([s.company,`${T.units}: ${s.units||""}`,T.fy(s.year),`${T.prepared}: ${new Date().toLocaleDateString(loc)}`].filter(Boolean).join("   ·   "),M,y);y+=14;
  g.fillStyle=P.fg;g.fillRect(M,y,CW,2);y+=22;
  const kw=(CW-5*12)/6;kpiData(c).forEach(([l,val,sub,bad],i)=>{const x=M+i*(kw+12);g.strokeStyle=P.line;g.lineWidth=1;g.strokeRect(x+.5,y+.5,kw,78);
    g.font=`500 11px ${F.mono}`;g.fillStyle=P.muted;g.fillText(clip(g,l.toUpperCase(),kw-20),x+10,y+20);
    g.font=`600 24px ${F.mono}`;g.fillStyle=bad?P.bad:P.fg;g.fillText(val,x+10,y+50);g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.fillText(clip(g,sub||"",kw-20),x+10,y+68)});
  y+=104;const vy=y;
  g.font=`700 19px ${F.disp}`;g.fillStyle=P.fg;y=wrap(g,v.h,M+18,y+18,CW-30,24);g.font=`14px ${F.sans}`;g.fillStyle=P.muted;y=wrap(g,v.p,M+18,y+2,CW-30,20);
  g.font=`13px ${F.sans}`;g.fillStyle=P.fg;v.notes.forEach(t=>{y=wrap(g,"•  "+t,M+18,y+2,CW-40,19)});
  if(v.levers.length){g.font=`600 13px ${F.sans}`;g.fillText(T.v.levers,M+18,y+8);y+=28;g.font=`13px ${F.sans}`;v.levers.forEach(t=>{y=wrap(g,"•  "+t,M+18,y,CW-40,19)})}
  g.fillStyle=[P.good,P.warn,P.bad][v.sev];g.fillRect(M,vy,5,y-vy);y+=20;
  const ch=Math.max(220,PH-y-70),cc=document.createElement("canvas");
  drawChart(cc,c,{fg:P.fg,muted:P.muted,line:P.line,good:P.good,bad:P.bad,warn:P.warn,accent:P.acc,surface:"#fff",mono:F.mono},CW,ch,SC);
  g.drawImage(cc,M,y,CW,ch);y+=ch+8;
  g.font=`12px ${F.sans}`;let lx=M;[[P.acc,T.lg.rev,3],[P.bad,T.lg.cost,3],[P.warn,T.lg.fix,2],[P.fg,T.lg.be,8]].forEach(([col,txt,h])=>{g.fillStyle=col;g.fillRect(lx,y+4-h/2,14,h);g.fillStyle=P.muted;g.fillText(txt,lx+20,y+8);lx+=g.measureText(txt).width+48});
  foot(g,1);
  // table pages: line item, FY amount, % of revenue
  const rows=[];const r=(lab,val,kind,p,red,valTxt)=>rows.push({lab,val,kind,p,red,valTxt});
  SECS.forEach(sec=>{rows.push({lab:T.sec[sec],kind:"sec"});model.lines.filter(l=>l.sec===sec).forEach(l=>r(labelOf(l),+l.v||0,"",c.P(+l.v||0)));
    if(sec==="rev")r(T.r.rev,c.rev,"sub",c.P(c.rev));
    if(sec==="var"){r(T.r.vc,c.vc,"sub",c.P(c.vc));r(T.r.cm,c.cm,"key",c.cmY,c.cmY!=null&&c.cmY<c.bC)}
    if(sec==="fix"){r(T.r.fix,c.fix,"sub",c.P(c.fix));r(T.r.ebitda,c.ebitda,"key",c.emY,c.emY!=null&&c.emY<c.bE)}
    if(sec==="below"){r(T.r.ebt,c.ebt,"sub",c.P(c.ebt));r(T.r.tax(`${c.taxRate}%`),c.tax,"",c.P(c.tax));r(T.r.ni,c.ni,"key",c.nmY)}});
  rows.push({lab:T.sec.be,kind:"sec"});
  r(T.r.cmr,null,"",c.cmY,false,"");r(T.r.be,c.be,"key",c.be==null?null:c.P(c.be));r(T.r.mos,c.mos,"",c.mos==null?null:c.P(c.mos));
  r(T.r.bept,c.bept,"",c.bept==null?null:c.P(c.bept));r(T.r.dol,null,"",null,false,xf(c.dol));
  const TW=Math.min(CW,1000),LW=TW-360,VW=180,RH=24,HH=40,top=M+40,per=Math.floor((PH-top-HH-70)/RH);
  for(let start=0,pn=2;start<rows.length;start+=per,pn++){
    g=newPage();g.fillStyle=P.fg;g.font=`700 18px ${F.disp}`;g.fillText(T.sheetTitle+(s.company?` · ${s.company}`:""),M,M+14);
    g.font=`12px ${F.sans}`;g.fillStyle=P.muted;g.fillText(`${T.units}: ${s.units||""}`,M,M+32);
    let ty=top;g.font=`500 11px ${F.mono}`;g.fillStyle=P.muted;g.textAlign="left";g.fillText(T.line.toUpperCase(),M+6,ty+24);g.textAlign="right";
    g.fillText(T.fy(s.year).toUpperCase(),M+LW+VW-8,ty+24);g.fillText(T.pcol.toUpperCase(),M+LW+2*VW-8,ty+24);
    g.fillStyle=P.fg;g.fillRect(M,ty+HH-1,TW,1.5);ty+=HH;
    rows.slice(start,start+per).forEach(row=>{
      if(row.kind==="sec"){g.fillStyle=P.band;g.fillRect(M,ty,TW,RH);g.fillStyle=P.fg;g.font=`600 12px ${F.sans}`;g.textAlign="left";g.fillText(row.lab.toUpperCase(),M+6,ty+16);ty+=RH;return}
      if(row.kind==="key"){g.fillStyle=P.accSoft;g.fillRect(M,ty,TW,RH)}
      const bold=row.kind==="sub"||row.kind==="key";g.fillStyle=P.fg;g.textAlign="left";g.font=`${bold?"600 ":""}12.5px ${F.sans}`;g.fillText(clip(g,row.lab,LW-12),M+6,ty+16);
      g.textAlign="right";g.font=`${bold?"600 ":""}12px ${F.mono}`;
      const vt=row.valTxt!=null?row.valTxt:fmt(row.val);g.fillStyle=row.val!=null&&row.val<0?P.bad:P.fg;g.fillText(vt,M+LW+VW-8,ty+16);
      g.fillStyle=row.red?P.bad:(row.p!=null&&row.p<0?P.bad:P.muted);g.fillText(pct(row.p),M+LW+2*VW-8,ty+16);
      g.fillStyle=P.line;g.fillRect(M,ty+RH-1,TW,1);ty+=RH});
    g.textAlign="left";foot(g,pn)}
  return pages}
$("btnPdf").onclick=async()=>{try{status(T.st.loading);await lib("jspdf");if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const pages=reportPages();const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
  const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
  pages.forEach((cv,i)=>{if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,pw,ph)});
  await offer(fname("pdf"),pdf.output("arraybuffer"),T.st.pdf)}catch(e){console.error(e);status(T.st.fail,"err")}};

texts();renderSettings();renderGrid();$("sample").hidden=!isSample;
})()}
